name: Reconcile Warp Theo Roadmap Status
on:
  push:
    branches: [docs/reconcile-warp-theo-status]
permissions:
  contents: write
jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-warp-theo-status
      - name: Reconcile roadmap lines
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/CMIS_PRODUCT_ROADMAP.md')
          s = p.read_text()
          old5 = "5. **Warp retention (#437), Theo transport (#422), and related provider investigations: PARALLEL RESEARCH. Delayed-departure longitudinal verification (#381): EVIDENCE-WAITING.** #381 is not an active software/productization blocker: current bounded delayed-departure, routed-ambiguity, and route-topology code deliberately keeps `departure_pattern_verified=false`, and semantic coverage still marks longitudinal verification unverified. Resume only when the append-only evidence ledger contains enough independent runs/pools to justify a predeclared deterministic replication rule; do not cherry-pick observations or retroactively tune thresholds. These investigations do not block the accepted flagship scan, wallet/trade, cross-chain, regulatory, or warning surfaces."
          new5 = "5. **Warp retention #437: COMPLETE / CLOSED. Theo transport #422: EXTERNALLY BLOCKED. Delayed-departure longitudinal verification #381: EVIDENCE-WAITING.** #437 is reconciled complete because its remaining lifecycle-retention requirement moved to child #441, which closed completed after merged PR #453 (`dd86a0443f195183d57723cd99f0a5a325d03888`) implemented the accepted bounded lifecycle-retention proof. Theo #422 remains open but is not an active software blocker: X mention, X API, xChat, and Telegram tests have not produced an acceptable current machine transport contract; keep `ACCEPTED_THEO_TRANSPORT_CONTRACTS` empty until provider-side identity + transport evidence exists. #381 remains evidence-waiting until a predeclared longitudinal replication rule can be evaluated without cherry-picking. None of these blocks the accepted flagship scan, wallet/trade, cross-chain, regulatory, or warning surfaces."
          old7 = "7. **Issue hygiene: ACTIVE / #385, #333, #335, #349, #350, #352, #354, #356, #358, #360, #367, #374 RESOLVED; #381 RECLASSIFIED EVIDENCE-WAITING.**"
          new7 = "7. **Issue hygiene: ACTIVE / #385, #333, #335, #349, #350, #352, #354, #356, #358, #360, #367, #374, #437 RESOLVED; #381 EVIDENCE-WAITING; #422 EXTERNALLY BLOCKED.**"
          if old5 not in s: raise SystemExit('roadmap line 5 not found')
          if old7 not in s: raise SystemExit('roadmap line 7 prefix not found')
          s = s.replace(old5, new5, 1).replace(old7, new7, 1)
          p.write_text(s)
      - name: Remove one-shot workflow
        run: rm .github/workflows/reconcile-warp-theo-status.yml
      - name: Commit reconciliation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CMIS_PRODUCT_ROADMAP.md .github/workflows/reconcile-warp-theo-status.yml
          git commit -m 'docs: reconcile Warp and Theo roadmap status'
          git push origin HEAD:docs/reconcile-warp-theo-status