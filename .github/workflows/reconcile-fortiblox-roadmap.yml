name: Reconcile FortiBlox Roadmap

on:
  push:
    branches:
      - docs/reconcile-fortiblox-567
    paths:
      - ".github/workflows/reconcile-fortiblox-roadmap.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/reconcile-fortiblox-567

      - name: Reconcile authoritative roadmap
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CMIS_PRODUCT_ROADMAP.md")
          text = path.read_text(encoding="utf-8")

          replacements = {
              "Last reconciled: 2026-09-09 (America/New_York)":
                  "Last reconciled: 2026-09-10 (America/New_York)",
              "## Live checkpoint — 2026-09-09":
                  "## Live checkpoint — 2026-09-10",
              "- **X1 direct wallet-relationship productization: ACTIVE under #631.** The historical deterministic direct-transfer relationship contract remains accepted as an internal/non-promoted foundation, but its old implementation paths are not present on current public `main`. #631 is therefore a source-of-truth reconciliation gate first and a public-service/Scout-reliance promotion gate second. No stale historical branch is treated as current authority; `execution_authorized=false`.":
                  "- **X1 direct wallet-relationship productization: ACTIVE / PUBLIC REQUEST+RESPONSE ACCEPTED / PROTECTED RUNTIME BLOCKED ON #52.** Phase A source-of-truth reconciliation passed. Public `wallet_relationship_intelligence/v1` response validation is accepted through PR #634 and selector-only `wallet_relationship_intelligence_request/v1` through PR #645 (`19a483f39cfb2adf314d778f07f2745ac4ad95e2`). Protected exact-transaction materialization remains staged in `cmis-core` PR #51 and selector dispatch in draft PR #56. Neither runtime registration, capability promotion, nor X1 Scout reliance may proceed until private Actions #52 executes real protected CI. Direct transfers remain observations only, never ownership/behavior/intent/risk evidence; `execution_authorized=false`.",
              "## Active execution order — 2026-09-09":
                  "## Active execution order — 2026-09-10",
              "2. **FortiBlox price fact-time freshness (#567): PRIMARY CONCRETE PROVIDER GATE.** Prove whether provider `updatedAt` actually timestamps `priceUsd` before any current-fact corroboration promotion.":
                  "2. **FortiBlox price fact-time freshness (#567): CLOSED — EVIDENCE_INCOMPLETE.** PR #648 accepted non-promoted `fortiblox_price_fact_time_probe/v1`. Exact-head deterministic and full public CMIS CI passed, but six bounded unauthenticated `/api/tokens` observations all returned HTTP 402, yielding zero usable snapshots. No payment/auth/wallet path was used. Therefore top-level `updatedAt` → per-token `priceUsd` fact-time semantics remain unproven; `fortiblox_price_freshness/v1` was not created, current-fact corroboration remains unauthorized, source independence remains unverified, volume freshness remains unverified, and `execution_authorized=false`.",
              "8. **Direct wallet-relationship intelligence promotion (#631): ACTIVE NEXT PRODUCT CAPABILITY.** Reconcile the accepted historical `cmis_wallet_relationship_evidence.v1` foundation against the current public/private split first; only then may a bounded X1 `wallet_relationship_intelligence/v1` service be promoted for X1 Scout reliance. Exact observed transfers are not ownership, beneficial ownership, insider/whale/bot status, coordination, manipulation, intent, causality, or risk. Bounded X1 ecosystem/network-brief inputs follow as a separate product slice.":
                  "8. **Direct wallet-relationship intelligence promotion (#631): PUBLIC CONTRACT STACK ACCEPTED / PROTECTED RUNTIME STAGED / BLOCKED ON #52.** Source reconciliation passed. Public response PR #634 and selector-only request PR #645 are accepted. Protected `x1_direct_wallet_transfer_materialization/v1` remains in PR #51, with staged selector dispatch in draft PR #56. Final `RuntimeCMISGateway` registration, protected/public capability promotion, and ROBERTA/X1 Scout #410 adoption remain blocked until private Actions executes real exact-head package 3.11/3.12 plus public-shell compatibility CI. Exact observed transfers are not ownership, beneficial ownership, insider/whale/bot status, coordination, manipulation, intent, causality, or risk; `execution_authorized=false`."
          }

          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one roadmap match, got {count}: {old[:100]!r}")
              text = text.replace(old, new)

          anchor = "- **Universal response freshness: ACCEPTED TARGET.**"
          fortiblox = (
              "- **FortiBlox price fact-time gate: CLOSED EVIDENCE_INCOMPLETE.** PR #648 merged as `693e24bfa9385ff1bc24cfa883a34ede788572ae`. "
              "The accepted `fortiblox_price_fact_time_probe/v1` distinguishes PROVEN / DISPROVEN / EVIDENCE_INCOMPLETE without promoting freshness. "
              "The bounded live no-payment gate observed HTTP 402 on all six `/api/tokens` attempts, so no field-level `updatedAt`→`priceUsd` proof exists. "
              "`fortiblox_price_freshness/v1` remains uncreated; current-fact corroboration, source independence, volume freshness, public/Scout promotion, and execution remain false.\n"
          )
          if fortiblox not in text:
              idx = text.find(anchor)
              if idx < 0:
                  raise SystemExit("universal freshness anchor not found")
              text = text[:idx] + fortiblox + text[idx:]

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit roadmap reconciliation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CMIS_PRODUCT_ROADMAP.md
          git diff --cached --check
          git commit -m "docs: reconcile FortiBlox and wallet productization status"
          git push origin HEAD:docs/reconcile-fortiblox-567
