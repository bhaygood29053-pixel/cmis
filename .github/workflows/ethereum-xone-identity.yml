name: Ethereum XONE Identity

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/ethereum/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_ethereum_xone_identity.py'
      - 'scripts/verify_ethereum_xone_identity.py'
      - 'docs/ETHEREUM_XONE_IDENTITY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/ethereum-xone-identity.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/ethereum/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_ethereum_xone_identity.py'
      - 'scripts/verify_ethereum_xone_identity.py'
      - 'docs/ETHEREUM_XONE_IDENTITY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/ethereum-xone-identity.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test exact Ethereum XONE identity contract
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ethereum_xone_identity.py
      - name: Test XONE/XNT conversion boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py

  live-identity:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify live exact Ethereum XONE identity with independent transports
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/verify_ethereum_xone_identity.py \
            --rpc https://ethereum-rpc.publicnode.com \
            --rpc https://eth.llamarpc.com \
            --rpc https://public.1rpc.io/eth \
            --minimum-proofs 2 \
            | tee evidence/ethereum-xone-identity.json

          python - <<'PY'
          import json

          data = json.load(open("evidence/ethereum-xone-identity.json"))
          assert data["status"] == "PASS"
          result = data["corroboration"]
          assert result["contract_version"] == "ethereum_xone_identity/v1"
          assert result["chain_id"] == "0x1"
          assert result["contract_address"] == "0x4dcda2274899d9bba3bb6f5a852c107dd6e4fe1c"
          assert result["creation_transaction"] == "0x6d2f0492d54b56044f03a3de5ad1889b6fe115914e9bcfc58e28950ddda6eea5"
          assert result["deployer"] == "0xc73fc08c931efe3fce850c09278472e8a81c2e05"
          assert result["erc20"] == {"name": "XONE", "symbol": "XONE", "decimals": 18}
          assert result["multi_rpc_corroborated"] is True
          assert result["transport_provider_diversity_verified"] is True
          assert result["xone_xnt_conversion_verified"] is False
          assert result["xnt_issuance_verified"] is False
          assert result["cross_chain_correlation_verified"] is False
          assert result["public_service_promoted"] is False
          assert result["scout_reliance_promoted"] is False
          assert result["execution_authorized"] is False
          print("ETHEREUM_XONE_EXACT_IDENTITY=PASS")
          print("XONE_XNT_CONVERSION_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ethereum-xone-identity-evidence
          path: evidence/ethereum-xone-identity.json
          if-no-files-found: error
