name: X1 XNT Distribution Mechanism Discovery

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_x1_xnt_distribution_mechanism_discovery.py'
      - 'scripts/discover_x1_xnt_distribution_mechanism.py'
      - 'docs/X1_XNT_DISTRIBUTION_MECHANISM_DISCOVERY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/x1-xnt-distribution-mechanism-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_x1_xnt_distribution_mechanism_discovery.py'
      - 'scripts/discover_x1_xnt_distribution_mechanism.py'
      - 'docs/X1_XNT_DISTRIBUTION_MECHANISM_DISCOVERY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/x1-xnt-distribution-mechanism-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test X1 XNT mechanism discovery
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_xnt_distribution_mechanism_discovery.py
      - name: Re-run XONE/XNT candidate discovery boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_candidate_discovery.py
      - name: Re-run XONE/XNT scraper boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py

  live-official-xnt-rules:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Discover official XNT distribution and vesting mechanism candidates
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/discover_x1_xnt_distribution_mechanism.py             | tee evidence/x1-xnt-distribution-mechanism-discovery.json

          python - <<'PY'
          import json

          data = json.load(open("evidence/x1-xnt-distribution-mechanism-discovery.json"))
          assert data["status"] == "PASS"
          assert data["contract_version"] == "x1_xnt_distribution_mechanism_discovery/v1"
          assert data["claim_count"] > 0
          expected = data["source_expectations"]
          assert expected["validator_reward_topic_present"] is True
          assert expected["lock_or_vesting_or_unlock_topic_present"] is True
          assert expected["credit_xnt_rate_50000_to_1_present"] is True
          assert expected["ten_percent_present"] is True
          assert expected["ninety_percent_present"] is True
          assert expected["365_days_present"] is True
          assert data["native_xnt_not_wxnt"] is True
          assert data["xnt_rule_claim_verified"] is False
          assert data["xnt_distribution_mechanism_identified"] is False
          assert data["xnt_issuance_verified"] is False
          assert data["xnt_vesting_or_unlock_verified"] is False
          assert data["xone_xnt_conversion_verified"] is False
          assert data["cross_chain_correlation_verified"] is False
          assert data["public_service_promoted"] is False
          assert data["scout_reliance_promoted"] is False
          assert data["execution_authorized"] is False

          discovery = data["candidate_discovery"]
          assert discovery["contract_version"] == data["contract_version"]
          if discovery["candidate_count"] == 0:
              assert discovery[
                  "zero_candidates_mean_only_no_exact_pubkeys_in_supplied_claims"
              ] is True
          else:
              assert len(data["candidate_qualifications"]) == discovery["candidate_count"]
              for proof in data["candidate_qualifications"]:
                  assert proof["account_state_verified"] is True
                  assert proof["candidate_role_verified"] is False
                  assert proof["xnt_distribution_mechanism_identified"] is False
                  assert proof["xone_xnt_conversion_verified"] is False
                  assert proof["execution_authorized"] is False

          print(f"OFFICIAL_XNT_RULE_CLAIMS={data['claim_count']}")
          print(f"EXACT_X1_CANDIDATES={discovery['candidate_count']}")
          print("XNT_DISTRIBUTION_MECHANISM_IDENTIFIED=FALSE")
          print("XONE_XNT_CONVERSION_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: x1-xnt-distribution-mechanism-discovery-evidence
          path: evidence/x1-xnt-distribution-mechanism-discovery.json
          if-no-files-found: error
