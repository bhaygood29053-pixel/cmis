name: Warp Wallet History Destination Settlement Evidence

on:
  pull_request:
    branches:
      - main
    paths:
      - "cmis_x1_warp_destination_settlement_live.py"
      - "liquidity_scout/providers/x1/warp_destination_settlement.py"
      - ".github/workflows/warp-wallet-history-destination-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destination-settlement:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install read-only probe dependency
        run: python -m pip install requests

      - name: Verify exact Warp destination transaction and block time
        env:
          PYTHONPATH: .
        run: python cmis_x1_warp_destination_settlement_live.py
