name: AGI Verified History Backfill Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agi-history-backfill:
    name: Read-only AGI verified price-history proof
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'probe/agi-verified-history-backfill'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      AGI_HISTORY_LOOKBACK_DAYS: "300"
      AGI_HISTORY_EVIDENCE_PATH: agi_verified_history_evidence.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify X1.Ninja key
        shell: bash
        run: |
          if [ -z "${X1_NINJA_API_KEY:-}" ]; then
            echo "X1_NINJA_API_KEY repository secret is unavailable."
            exit 1
          fi

      - name: Probe AGI verified price-history backfill
        run: |
          python cmis_agi_verified_history_probe.py

      - name: Upload AGI history evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agi-verified-history-evidence
          path: agi_verified_history_evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only XDEX/X1.Ninja market evidence only."
          echo "Temporary SQLite storage only; no production history database is modified."
          echo "No swap preparation, transaction construction, signing, broadcasting, custody, execution, or value movement."
