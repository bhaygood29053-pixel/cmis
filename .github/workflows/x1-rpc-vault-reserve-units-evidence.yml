name: X1 RPC Vault Reserve Unit Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpc-vault-reserve-units:
    name: X1 RPC vault balances and decimals
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/issue339-rpc-vault-reserve-units'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_RPC_VAULT_RESERVE_UNITS_LIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic reserve-unit tests
        run: |
          python -m unittest tests.test_x1_rpc_vault_reserve_units -v

      - name: Run live read-only reserve-unit evidence
        run: |
          python -m unittest tests.test_x1_rpc_vault_reserve_units_live -v

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only RPC reserve-unit evidence only."
          echo "No base/quote, USD valuation, liquidity, price, volume, market-cap or freshness promotion."
          echo "No Scout/public-service/risk/execution authority."
          echo "No transaction construction, signing, broadcasting, custody, trading, or value movement."
