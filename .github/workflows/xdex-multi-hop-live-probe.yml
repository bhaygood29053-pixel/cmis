name: XDEX Multi-Hop Live Probe

on:
  pull_request:
    paths:
      - "scripts/probe_xdex_multi_hop_quote.py"
      - "scripts/probe_xdex_multi_hop_route_snapshot.py"
      - "liquidity_scout/providers/x1/xdex_multi_hop.py"
      - "liquidity_scout/providers/x1/xdex_multi_hop_onchain.py"
      - "liquidity_scout/services/cmis_xdex_multi_hop_route_intelligence.py"
      - "liquidity_scout/services/cmis_xdex_multi_hop_route_snapshot.py"
      - "tests/test_xdex_multi_hop_provider.py"
      - "tests/test_xdex_multi_hop_onchain.py"
      - "tests/test_cmis_xdex_multi_hop_route_intelligence.py"
      - "tests/test_cmis_xdex_multi_hop_route_snapshot.py"
      - "tests/test_xdex_verified_native_pair_live.py"
      - ".github/workflows/xdex-multi-hop-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-read-only-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CMIS
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run deterministic multi-hop contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_xdex_multi_hop_provider.py \
            tests/test_xdex_multi_hop_onchain.py \
            tests/test_cmis_xdex_multi_hop_route_intelligence.py \
            tests/test_cmis_xdex_multi_hop_route_snapshot.py

      - name: Discover, verify, and snapshot one current indirect XDEX route
        id: probe
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/probe_xdex_multi_hop_route_snapshot.py

      - name: Upload exact public quote, X1-RPC, and route-snapshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdex-multi-hop-live-probe
          path: artifacts/xdex_multi_hop_probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Require successful independent live snapshot
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/xdex_multi_hop_probe.json")
          if not path.exists():
              raise SystemExit("probe artifact missing")
          data = json.loads(path.read_text(encoding="utf-8"))
          verification = data.get("onchain_verification")
          snapshot = data.get("route_snapshot")
          required = (
              "route_structure_verified",
              "pool_identity_verified",
              "pool_state_verified",
              "fee_math_verified",
              "reserve_math_verified",
              "current_state_alignment_verified",
          )
          if not isinstance(verification, dict) or not all(verification.get(key) is True for key in required):
              raise SystemExit("independent X1-RPC route verification incomplete")
          if not isinstance(snapshot, dict) or snapshot.get("contract_version") != "xdex_multi_hop_route_snapshot/v1":
              raise SystemExit("Phase-2 route snapshot missing or wrong version")
          if snapshot.get("route_output", {}).get("aggregate_hop_output_verified") is not True:
              raise SystemExit("aggregate route output is not independently verified")
          if snapshot.get("provider_routing_fee_transform", {}).get("arithmetic_transform_verified") is not True:
              raise SystemExit("provider routing-fee arithmetic transform is not verified")
          if snapshot.get("provider_routing_fee_transform", {}).get("business_semantics_verified") is not False:
              raise SystemExit("provider routing-fee business semantics widened")
          for field in ("price_impact", "minimum_received", "network_fee"):
              if snapshot.get(field, {}).get("status") != "EVIDENCE_REQUIRED":
                  raise SystemExit(f"unsupported {field} semantics were promoted")
          if snapshot.get("provider_raw_json_exposed") is not False:
              raise SystemExit("raw provider JSON leaked across snapshot boundary")
          if snapshot.get("route_optimality_verified") is not False:
              raise SystemExit("route optimality must remain unverified")
          if snapshot.get("execution_authorized") is not False:
              raise SystemExit("execution authority widened")
          print("CMIS #684 independently verified live route snapshot: PASS")
          PY
