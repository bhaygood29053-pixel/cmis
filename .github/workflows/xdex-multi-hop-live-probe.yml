name: XDEX Multi-Hop Live Probe

on:
  pull_request:
    paths:
      - "scripts/probe_xdex_multi_hop_quote.py"
      - "liquidity_scout/providers/x1/xdex_multi_hop.py"
      - "liquidity_scout/providers/x1/xdex_multi_hop_onchain.py"
      - "liquidity_scout/services/cmis_xdex_multi_hop_route_intelligence.py"
      - "tests/test_xdex_multi_hop_provider.py"
      - "tests/test_xdex_multi_hop_onchain.py"
      - "tests/test_cmis_xdex_multi_hop_route_intelligence.py"
      - "tests/test_xdex_verified_native_pair_live.py"
      - ".github/workflows/xdex-multi-hop-live-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-read-only-probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check out CMIS
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CMIS dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run deterministic multi-hop contract tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_xdex_multi_hop_provider.py \
            tests/test_xdex_multi_hop_onchain.py \
            tests/test_cmis_xdex_multi_hop_route_intelligence.py

      - name: Discover, quote, and independently verify one current indirect XDEX route
        id: probe
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: python scripts/probe_xdex_multi_hop_quote.py

      - name: Upload exact public quote and X1-RPC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xdex-multi-hop-live-probe
          path: artifacts/xdex_multi_hop_probe.json
          if-no-files-found: error
          retention-days: 14

      - name: Require successful independent live verification
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/xdex_multi_hop_probe.json")
          if not path.exists():
              raise SystemExit("probe artifact missing")
          data = json.loads(path.read_text(encoding="utf-8"))
          verification = data.get("onchain_verification")
          required = (
              "route_structure_verified",
              "pool_identity_verified",
              "pool_state_verified",
              "fee_math_verified",
              "reserve_math_verified",
              "current_state_alignment_verified",
          )
          if not isinstance(verification, dict) or not all(verification.get(key) is True for key in required):
              print(json.dumps({
                  "status": "EVIDENCE_REQUIRED",
                  "failure_stage": data.get("failure_stage"),
                  "fatal_error": data.get("fatal_error"),
                  "pool_count": data.get("pool_count"),
                  "token_count": data.get("token_count"),
                  "candidate_count": data.get("candidate_count"),
                  "attempt_count": data.get("attempt_count"),
                  "rpc_slot_before": data.get("rpc_slot_before"),
                  "rpc_slot_after": data.get("rpc_slot_after"),
                  "onchain_verification": verification,
              }, sort_keys=True))
              raise SystemExit(2)
          if verification.get("route_optimality_verified") is not False:
              raise SystemExit("route optimality must remain unverified")
          if verification.get("execution_authorized") is not False:
              raise SystemExit("execution authority widened")
          print("CMIS #681 independently verified live multi-hop route: PASS")
          PY
