name: X1.Ninja Delayed Vault Departure Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  delayed-vault-departure:
    name: Price-only departures vs earlier exact vault swaps
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/issue360-delayed-vault-swap-departure-link'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_NINJA_DELAYED_DEPARTURE_LIVE: "1"
      X1_NINJA_DELAYED_DEPARTURE_MAX_SNAPSHOTS: "80"
      X1_NINJA_DELAYED_DEPARTURE_POLL_SECONDS: "8"
      X1_NINJA_DELAYED_DEPARTURE_CATALOG_LIMIT: "100"
      X1_NINJA_DELAYED_DEPARTURE_MAX_POOLS: "30"
      X1_NINJA_DELAYED_DEPARTURE_TARGET_EVENTS: "5"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify X1.Ninja key
        run: |
          test -n "${X1_NINJA_API_KEY:-}"
      - name: Run deterministic delayed-departure tests
        run: |
          python -m unittest tests.test_x1_ninja_delayed_vault_departure_link -v
      - name: Run bounded live delayed-departure evidence
        run: |
          python -m unittest tests.test_x1_ninja_delayed_vault_departure_link_live -v
      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1.Ninja/X1 RPC delayed-departure evidence only."
          echo "Fixed pre-BEFORE lookback: 900 seconds, max 100 signatures per exact vault."
          echo "No provider source/fact-time/freshness inference from timing correlation."
          echo "No priceUsd, liquidity, TVL, source-independence, transaction construction, signing, broadcasting, custody, trading, or execution promotion."
