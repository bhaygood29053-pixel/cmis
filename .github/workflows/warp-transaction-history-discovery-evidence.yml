name: Warp Transaction History Discovery Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp-transaction-history-discovery:
    name: Probe Warp read-only transaction history semantics
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/issue433-warp-transaction-history-source')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run deterministic discovery and pairing tests
        run: |
          python -m pytest -q \
            tests/test_x1_warp_transaction_history_discovery.py \
            tests/test_x1_warp_onchain_transfer_history.py

      - name: Probe live executed transaction page
        run: |
          python - <<'PY'
          import json
          import urllib.request

          from liquidity_scout.providers.x1.warp_transaction_history_discovery import (
              build_signatures_url,
              build_transactions_url,
              summarize_signatures_response,
              summarize_transactions_page,
          )

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "CMIS-Warp-ReadOnly-Evidence/1.0",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  status = int(response.status)
                  content_type = str(response.headers.get("Content-Type") or "")
                  body = response.read()
              assert status == 200, (url, status)
              assert "json" in content_type.casefold(), (url, content_type)
              return json.loads(body.decode("utf-8")), {
                  "status": status,
                  "content_type": content_type,
              }

          url = build_transactions_url(status="executed", limit=50, page=1)
          payload, http = get_json(url)
          summary = summarize_transactions_page(
              payload,
              requested_status="executed",
          )
          assert summary["transaction_count"] > 0, "no executed records available"
          assert "txSig" in summary["transaction_record_field_union"]
          assert "status" in summary["transaction_record_field_union"]

          first_tx = next(
              row
              for row in summary["sample_transactions"]
              if isinstance(row.get("txSig"), str) and row.get("txSig")
          )
          signatures_payload, signatures_http = get_json(
              build_signatures_url(first_tx["txSig"])
          )
          signatures_summary = summarize_signatures_response(
              signatures_payload,
              tx_sig=first_tx["txSig"],
          )

          page2 = None
          total = summary["pagination_metadata"].get("total")
          page_size = (
              summary["pagination_metadata"].get("pageSize")
              or summary["pagination_metadata"].get("limit")
          )
          if (
              isinstance(total, int)
              and isinstance(page_size, int)
              and total > page_size
          ):
              payload2, http2 = get_json(
                  build_transactions_url(
                      status="executed",
                      limit=50,
                      page=2,
                  )
              )
              page2 = {
                  "http": http2,
                  "summary": summarize_transactions_page(
                      payload2,
                      requested_status="executed",
                  ),
              }

          evidence = {
              "transactions_http": http,
              "transactions": summary,
              "signatures_http": signatures_http,
              "signatures": signatures_summary,
              "page2": page2,
              "field_semantics_verified": False,
              "pagination_semantics_verified": False,
              "coverage_complete_verified": False,
              "flow_event_normalization_authorized": False,
              "execution_authorized": False,
          }

          print("WARP_TRANSACTION_HISTORY_DISCOVERY_EVIDENCE")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Pair live Warp message state and feed Bridge Flow Intelligence
        run: |
          python - <<'PY'
          import json
          import pathlib
          import time

          from liquidity_scout.providers.x1.bridge_source_provenance import (
              BridgeSourceProof,
              evaluate_bridge_source_provenance,
          )
          from liquidity_scout.providers.x1.warp_config_semantics import (
              WARP_CONFIG_SOURCE_URL,
              build_warp_config_route_observation,
          )
          from liquidity_scout.providers.x1.warp_onchain_transfer_history import (
              capture_warp_message_state,
              normalize_warp_route_events,
          )
          from liquidity_scout.services.cmis_bridge_flow_intelligence import (
              build_bridge_flow_intelligence,
          )
          from liquidity_scout.services.cmis_bridge_route_evidence import (
              qualify_warp_bridge_route,
          )
          from liquidity_scout.services.cmis_cross_chain_provenance import (
              build_cross_chain_asset_provenance,
          )

          WSOL = "So11111111111111111111111111111111111111112"
          WSOL_X = "JDqX4vau2P5zJmLpuNitvR6vMURr9kYjex6oZQXz3Ja8"
          ROUTE_ID = "warp-solana-x1-wsol"

          def endpoint(chain, mint):
              return {
                  "chain": chain,
                  "asset_id": mint,
                  "asset_id_kind": "mint",
              }

          fixture = json.loads(
              pathlib.Path(
                  "tests/fixtures/warp_bridge_config_20260903.json"
              ).read_text(encoding="utf-8")
          )
          observation = build_warp_config_route_observation(
              config_response=fixture,
              route_id=ROUTE_ID,
              source=endpoint("solana", WSOL),
              destination=endpoint("x1", WSOL_X),
          )
          assert observation["route_decimals"] == 9

          provenance = build_cross_chain_asset_provenance(
              canonical_asset_id="sol",
              origin=endpoint("solana", WSOL),
              current=endpoint("x1", WSOL_X),
              hops=[
                  {
                      "source": endpoint("solana", WSOL),
                      "destination": endpoint("x1", WSOL_X),
                      "bridge": "Warp Bridge",
                      "representation_type": "bridge_representation",
                      "custody_model": "unknown",
                      "bridge_route_id": ROUTE_ID,
                  }
              ],
          )
          source_provenance = evaluate_bridge_source_provenance(
              url=WARP_CONFIG_SOURCE_URL,
              proofs=[
                  BridgeSourceProof(
                      proof_type="official_app_network_observation",
                      reference=(
                          "2026-09-03 clean Chrome HAR from "
                          "https://app.bridge.x1.xyz/info"
                      ),
                      exact_url=WARP_CONFIG_SOURCE_URL,
                  )
              ],
          )
          qualification = qualify_warp_bridge_route(
              provenance=provenance,
              hop_index=0,
              source_provenance=source_provenance,
              observation=observation,
              evaluated_at=observation["source_observed_at"] + 1,
          )
          assert qualification["warp_qualified"] is True

          message_state = capture_warp_message_state()
          normalized = normalize_warp_route_events(
              route_observation=observation,
              message_state=message_state,
          )

          assert normalized["pairing_semantics_verified"] is True
          assert normalized["settled_event_semantics_verified"] is True
          assert normalized["flow_event_normalization_authorized"] is True
          assert normalized["accepted_settled_event_count"] > 0
          assert normalized["coverage_complete_verified"] is False
          assert normalized["historical_retention_complete_verified"] is False
          assert normalized["execution_authorized"] is False

          as_of = time.time()
          coverage_start = normalized["observed_coverage_start"] or (as_of - 1)
          flow = build_bridge_flow_intelligence(
              route_qualification=qualification,
              events=normalized["events"],
              as_of=as_of,
              coverage_start=coverage_start,
              coverage_end=as_of,
              coverage_verified=False,
              source_independence_verified=False,
          )

          assert flow["event_accounting"]["accepted_settled_event_count"] > 0
          assert flow["windows"]["24h"]["current"]["inflow_raw"] is None
          assert flow["windows"]["7d"]["current"]["outflow_raw"] is None
          assert flow["windows"]["30d"]["current"]["net_flow_raw"] is None
          assert flow["missing_history_zero_filled"] is False
          assert flow["execution_authorized"] is False

          evidence = {
              "contract": normalized["contract"],
              "program_id": message_state["program_id"],
              "message_account_counts": {
                  "solana_outgoing": message_state["solana"]["outgoing"][
                      "decoded_account_count"
                  ],
                  "solana_incoming": message_state["solana"]["incoming"][
                      "decoded_account_count"
                  ],
                  "x1_outgoing": message_state["x1"]["outgoing"][
                      "decoded_account_count"
                  ],
                  "x1_incoming": message_state["x1"]["incoming"][
                      "decoded_account_count"
                  ],
              },
              "candidate_route_outgoing_count": normalized[
                  "candidate_route_outgoing_count"
              ],
              "accepted_settled_event_count": normalized[
                  "accepted_settled_event_count"
              ],
              "unresolved_counts": normalized["unresolved_counts"],
              "observed_coverage_start": normalized["observed_coverage_start"],
              "observed_latest_settlement": normalized[
                  "observed_latest_settlement"
              ],
              "sample_events": normalized["events"][-5:],
              "pairing_semantics_verified": True,
              "settled_event_semantics_verified": True,
              "historical_retention_complete_verified": False,
              "coverage_complete_verified": False,
              "calculator_real_events_accepted": flow["event_accounting"][
                  "accepted_settled_event_count"
              ],
              "calculator_windows_withheld_for_incomplete_coverage": True,
              "missing_history_zero_filled": False,
              "execution_authorized": False,
          }

          print("WARP_ONCHAIN_TRANSFER_HISTORY_EVIDENCE")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo "GET/read-only Warp transaction-history evidence only."
          echo "No POST, transfer construction, signing, broadcast, custody, or value movement."
          echo "Raw response bodies and guardian signatures are not retained as artifacts."
          echo "Discovery does not itself authorize bridge-flow normalization or coverage claims."
          echo "EXECUTION_AUTHORIZED=FALSE"
