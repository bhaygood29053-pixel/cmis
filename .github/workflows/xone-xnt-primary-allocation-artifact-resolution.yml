name: XONE XNT Primary Allocation Artifact Resolution

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_primary_allocation_artifact_resolution.py'
      - 'scripts/resolve_xone_xnt_primary_allocation_artifact.py'
      - 'docs/XONE_XNT_PRIMARY_ALLOCATION_ARTIFACT_RESOLUTION_V1.md'
      - '.github/workflows/xone-xnt-primary-allocation-artifact-resolution.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_primary_allocation_artifact_resolution.py'
      - 'scripts/resolve_xone_xnt_primary_allocation_artifact.py'
      - 'docs/XONE_XNT_PRIMARY_ALLOCATION_ARTIFACT_RESOLUTION_V1.md'
      - '.github/workflows/xone-xnt-primary-allocation-artifact-resolution.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test primary allocation artifact resolver
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_primary_allocation_artifact_resolution.py
      - name: Re-run allocation source provenance boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_allocation_source_provenance.py
      - name: Re-run X1 allocation-record boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_x1_allocation_record_discovery.py

  no-lead-operational:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Prove NO_LEAD runtime import graph is network-client-free
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import importlib.abc
          import runpy
          import sys

          forbidden_roots = {"requests", "httpx", "aiohttp"}
          forbidden_exact = {"urllib.request", "socket"}

          class BlockNetworkClients(importlib.abc.MetaPathFinder):
              def find_spec(self, fullname, path=None, target=None):
                  root = fullname.split(".", 1)[0]
                  if root in forbidden_roots or fullname in forbidden_exact:
                      raise ImportError(
                          f"network client import blocked during NO_LEAD proof: {fullname}"
                      )
                  return None

          sys.meta_path.insert(0, BlockNetworkClients())
          sys.argv = [
              "scripts/resolve_xone_xnt_primary_allocation_artifact.py",
              "--observed-at",
              "1",
          ]

          try:
              runpy.run_path(
                  "scripts/resolve_xone_xnt_primary_allocation_artifact.py",
                  run_name="__main__",
              )
          except SystemExit as exc:
              assert exc.code == 0, exc.code

          loaded = set(sys.modules)
          leaked = sorted(
              name
              for name in loaded
              if name.split(".", 1)[0] in forbidden_roots
              or name in forbidden_exact
          )
          assert leaked == [], leaked
          print("TRANSITIVE_NETWORK_CLIENT_IMPORTS=0")
          PY
      - name: Prove intentional NO_LEAD state
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/resolve_xone_xnt_primary_allocation_artifact.py             --observed-at 1             | tee evidence/xone-xnt-primary-allocation-artifact-resolution.json

          python - <<'PY'
          import json

          path = "evidence/xone-xnt-primary-allocation-artifact-resolution.json"
          data = json.load(open(path))

          assert data["status"] == "PASS"
          assert (
              data["contract_version"]
              == "xone_xnt_primary_allocation_artifact_resolution/v1"
          )
          assert data["resolution_state"] == "NO_LEAD"
          assert data["network_discovery_performed"] is False
          assert data["network_request_count"] == 0
          assert data["lead_supplied"] is False
          assert data["primary_artifact_candidate_discovered"] is False
          assert data["primary_artifact_resolved_for_handoff"] is False
          assert data["handoffs"] == []
          assert (
              data["private_or_unpublished_allocation_source_absence_proven"]
              is False
          )
          assert data["allocation_source_provenance_verified"] is False
          assert data["authoritative_allocation_source_verified"] is False
          assert data["official_xone_snapshot_verified"] is False
          assert data["official_registry_artifact_verified"] is False
          assert data["xone_snapshot_eligibility_verified"] is False
          assert data["xone_snapshot_xnt_allocation_binding_verified"] is False
          assert data["xnt_issuance_verified"] is False
          assert data["xnt_vesting_or_unlock_verified"] is False
          assert data["october_6_unlock_applies_to_xone_verified"] is False
          assert data["xone_xnt_conversion_verified"] is False
          assert data["cross_chain_correlation_verified"] is False
          assert data["public_service_promoted"] is False
          assert data["scout_reliance_promoted"] is False
          assert data["execution_authorized"] is False

          print("RESOLUTION_STATE=NO_LEAD")
          print("NETWORK_REQUEST_COUNT=0")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xone-xnt-primary-allocation-artifact-resolution-evidence
          path: evidence/xone-xnt-primary-allocation-artifact-resolution.json
          if-no-files-found: error
