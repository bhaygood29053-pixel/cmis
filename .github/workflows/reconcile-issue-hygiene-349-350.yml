name: Reconcile Issue Hygiene 349 350

on:
  push:
    branches:
      - docs/reconcile-ninja-price-seed-349-350
    paths:
      - ".github/workflows/reconcile-issue-hygiene-349-350.yml"

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: docs/reconcile-ninja-price-seed-349-350

      - name: Reconcile roadmap issue-hygiene status
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/CMIS_PRODUCT_ROADMAP.md")
          text = path.read_text(encoding="utf-8")

          old = "7. **Issue hygiene: ACTIVE / #385, #333, #335 RESOLVED.** The original Instant X1 Scan freshness umbrella #385 and the early X1.Ninja transport/identity umbrellas #333/#335 are now reconciled against accepted later contracts and closed completed. Continue auditing older open tickets before treating open-issue count as remaining roadmap work; preserve historical evidence boundaries rather than silently widening authority."
          new = "7. **Issue hygiene: ACTIVE / #385, #333, #335, #349, #350 RESOLVED.** The original Instant X1 Scan freshness umbrella #385, the early X1.Ninja transport/identity umbrellas #333/#335, and the X1.Ninja execution-price seed/multi-swap gates #349/#350 are reconciled against accepted later contracts and closed completed. PR #351 (`ab1e9843e157a165497e007580c424055f2f248c`) established bounded trade-row execution-price semantics across 5 finalized swaps / 5 exact pools / both directions; unresolved current pool-catalog linkage/fact-time semantics remain owned by #352 and later follow-ups rather than being relabeled as proven. Continue auditing older open tickets before treating open-issue count as remaining roadmap work; preserve historical evidence boundaries rather than silently widening authority."

          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one issue-hygiene line, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Commit roadmap reconciliation and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/reconcile-issue-hygiene-349-350.yml
          git add docs/CMIS_PRODUCT_ROADMAP.md .github/workflows/reconcile-issue-hygiene-349-350.yml
          git diff --cached --check
          git commit -m "docs: reconcile completed X1.Ninja price seed gates 349 350"
          git push origin HEAD:docs/reconcile-ninja-price-seed-349-350
