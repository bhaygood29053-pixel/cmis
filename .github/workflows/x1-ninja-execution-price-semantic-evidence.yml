name: X1.Ninja Execution Price Semantic Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  execution-price-semantics:
    name: Ninja priceNative vs exact XDEX swap price
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/issue350-ninja-execution-price-semantics'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_NINJA_EXECUTION_PRICE_LIVE: "1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify X1.Ninja key
        run: |
          test -n "${X1_NINJA_API_KEY:-}"
      - name: Run deterministic execution-price tests
        run: |
          python -m unittest tests.test_x1_ninja_execution_price_semantics -v
      - name: Run live read-only multi-swap evidence
        run: |
          python -m unittest tests.test_x1_ninja_execution_price_semantics_live -v
      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1.Ninja/X1 RPC price evidence only."
          echo "No priceUsd, liquidity, TVL, freshness, source-independence, transaction construction, signing, broadcasting, custody, or execution promotion."
