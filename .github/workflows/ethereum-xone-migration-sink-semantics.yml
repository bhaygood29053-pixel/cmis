name: Ethereum XONE Migration Sink Semantics

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/ethereum/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_ethereum_xone_migration_sink_semantics.py'
      - 'scripts/verify_ethereum_xone_migration_sink_semantics.py'
      - 'docs/ETHEREUM_XONE_MIGRATION_SINK_SEMANTICS_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/ethereum-xone-migration-sink-semantics.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/ethereum/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_ethereum_xone_migration_sink_semantics.py'
      - 'scripts/verify_ethereum_xone_migration_sink_semantics.py'
      - 'docs/ETHEREUM_XONE_MIGRATION_SINK_SEMANTICS_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/ethereum-xone-migration-sink-semantics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test XONE migration-sink semantics
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ethereum_xone_migration_sink_semantics.py
      - name: Re-run XONE event observer boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ethereum_xone_event_observer.py
      - name: Re-run XONE identity boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ethereum_xone_identity.py
      - name: Re-run XONE/XNT scraper boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py

  live-semantics:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify live XONE burn surface without inventing a migration sink
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/verify_ethereum_xone_migration_sink_semantics.py \
            --rpc https://gateway.tenderly.co/public/mainnet \
            --rpc https://eth-mainnet.public.blastapi.io \
            --rpc https://eth.merkle.io \
            --rpc https://eth.drpc.org \
            --rpc https://public.1rpc.io/eth \
            --minimum-proofs 2 \
            | tee evidence/ethereum-xone-migration-sink-semantics.json

          python - <<'PY'
          import json

          data = json.load(open("evidence/ethereum-xone-migration-sink-semantics.json"))
          assert data["status"] == "PASS"
          proof = data["burn_surface"]
          assert proof["contract_version"] == "ethereum_xone_migration_sink_semantics/v1"
          assert proof["contract_address"] == "0x4dcda2274899d9bba3bb6f5a852c107dd6e4fe1c"
          assert proof["multi_rpc_corroborated"] is True
          assert proof["transport_provider_diversity_verified"] is True
          assert proof["selectors"]["burn(address,uint256)"] == "0x9dc29fac"
          assert proof["selectors"]["userBurns(address)"] == "0xce653d5f"
          assert proof["selectors"]["onTokenBurned(address,uint256)"] == "0x543746b1"
          assert proof["xone_burn_accounting_surface_verified"] if "xone_burn_accounting_surface_verified" in proof else True
          assert proof["simple_transfer_sink_required_by_this_proof"] is False
          assert proof["migration_sink_identified"] is False
          assert proof["xone_xnt_conversion_verified"] is False
          assert proof["xnt_issuance_verified"] is False
          assert proof["cross_chain_correlation_verified"] is False
          assert proof["public_service_promoted"] is False
          assert proof["scout_reliance_promoted"] is False
          assert proof["execution_authorized"] is False
          print("ETHEREUM_XONE_BURN_SURFACE=PASS")
          print("MIGRATION_SINK_IDENTIFIED=FALSE")
          print("XONE_XNT_CONVERSION_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ethereum-xone-migration-sink-semantics-evidence
          path: evidence/ethereum-xone-migration-sink-semantics.json
          if-no-files-found: error
