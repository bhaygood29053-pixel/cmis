name: XDEX Oracle Price Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  oracle-price-probe:
    name: Read-only XDEX oracle price contract
    if: github.head_ref == 'agent/issue28-xdex-quote-semantics'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependency
        run: python -m pip install requests

      - name: Probe oracle price, details, and sell-quote contracts
        run: |
          python - <<'PY'
          import json
          import requests

          PRICE_URL = 'https://oracle.xdex.xyz/api/v1/token/price'
          SELL_QUOTE_URL = 'https://oracle.xdex.xyz/api/v1/token/sell-quote'
          XENCAT = 'DQ6sApYPMJ8LwpvyUjthL7amykNBJ3fx5jZi2koN7vHb'
          XNT = 'So11111111111111111111111111111111111111112'

          def probe(label, url, params):
              try:
                  response = requests.get(url, params=params, timeout=20)
                  try:
                      body = response.json()
                  except Exception:
                      body = response.text[:4000]
                  print('[XDEX oracle evidence] ' + json.dumps({
                      'probe': label,
                      'status': response.status_code,
                      'content_type': response.headers.get('content-type'),
                      'request_url': response.url,
                      'body': body,
                  }, sort_keys=True, default=str))
              except Exception as exc:
                  print('[XDEX oracle evidence] ' + json.dumps({
                      'probe': label,
                      'error': f'{type(exc).__name__}: {exc}',
                  }, sort_keys=True))

          probe('single_xencat', PRICE_URL, {'token_address': XENCAT})
          probe('single_xnt', PRICE_URL, {'token_address': XNT})
          probe('all_details', PRICE_URL, {'all': 'true', 'details': 'true'})

          for amount in ('1', '2', '1000', '50000'):
              probe(
                  f'sell_quote_xencat_{amount}',
                  SELL_QUOTE_URL,
                  {'token_address': XENCAT, 'amount_in': amount},
              )
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo 'Read-only HTTP GET requests only.'
          echo 'No transaction construction, signing, broadcasting, custody, or value movement.'