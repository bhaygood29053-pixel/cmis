name: X1 Oracle V2 Freshness Governance Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  oracle-v2-freshness-governance:
    name: Verify accepted Oracle V2 freshness governance
    if: github.head_ref == 'agent/oracle-v2-freshness-governance'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      FRESHNESS_POLICY_FILE: liquidity_scout/providers/x1/oracle_v2_freshness_policy.json

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic freshness tests
        run: |
          python -m unittest \
            tests.test_x1_oracle_v2_freshness_policy \
            tests.test_x1_oracle_v2_current_freshness \
            tests.test_x1_oracle_v2_production_freshness_policy \
            -v

      - name: Collect live current-slot evidence under accepted policy
        run: |
          python cmis_x1_oracle_v2_current_freshness.py \
            --freshness-policy-file "$FRESHNESS_POLICY_FILE" \
            --output x1-oracle-v2-freshness-governance.json

      - name: Enforce policy and eligible-only median boundary
        run: |
          python - <<'PY'
          import json

          with open(
              "x1-oracle-v2-freshness-governance.json",
              "r",
              encoding="utf-8",
          ) as handle:
              result = json.load(handle)

          policy = result["freshness_policy"]
          assert result["timestamp_unit_verified"] is True
          assert policy["policy_complete"] is True
          assert policy["has_hidden_defaults"] is False
          assert policy["max_age_ms"] == 60_000
          assert policy["max_future_skew_ms"] == 5_000
          assert policy["minimum_eligible_slots"] == 3
          assert result["freshness_policy_applied"] is True
          assert result["freshness_verified"] is True
          assert result["age_summary"]["slot_count"] == 30
          assert result["age_summary"]["positive_timestamp_age_count"] == 30

          for asset, value in result["assets"].items():
              eligible = sorted(
                  slot["price_raw"]
                  for slot in value["slot_classifications"]
                  if slot.get("cmis_price_eligible") is True
              )
              assert value["eligible_slot_count"] == len(eligible), asset

              if len(eligible) >= 3:
                  assert value["status"] == "ok", asset
                  middle = len(eligible) // 2
                  if len(eligible) % 2:
                      numerator = eligible[middle]
                      denominator = 1
                  else:
                      numerator = eligible[middle - 1] + eligible[middle]
                      denominator = 2
                  assert value["median_price_raw_numerator"] == numerator, asset
                  assert value["median_price_raw_denominator"] == denominator, asset
                  assert value["median_price"] is not None, asset
              elif eligible:
                  assert value["status"] == "partial", asset
                  assert value["median_price_raw_numerator"] is None, asset
                  assert value["median_price_raw_denominator"] is None, asset
                  assert value["median_price"] is None, asset
              else:
                  assert value["status"] == "unavailable", asset
                  assert value["median_price_raw_numerator"] is None, asset
                  assert value["median_price_raw_denominator"] is None, asset
                  assert value["median_price"] is None, asset

          for field in (
              "current_price_use_authorized",
              "cmis_provider_promoted",
              "public_service_promoted",
              "scout_reliance_promoted",
              "source_independence_verified",
              "price_correctness_verified",
              "execution_authorized",
          ):
              assert result[field] is False, field

          print("timestamp_unit_verified=true")
          print("freshness_policy_complete=true")
          print("freshness_policy_applied=true")
          print(f"live_status={result['status']}")
          print("price_correctness_verified=false")
          print("source_independence_verified=false")
          print("current_price_use_authorized=false")
          PY

      - name: Record policy and evidence digests
        run: |
          sha256sum "$FRESHNESS_POLICY_FILE"
          sha256sum x1-oracle-v2-freshness-governance.json

      - name: Upload freshness governance evidence
        uses: actions/upload-artifact@v4
        with:
          name: x1-oracle-v2-freshness-governance-${{ github.run_id }}
          path: |
            x1-oracle-v2-freshness-governance.json
            liquidity_scout/providers/x1/oracle_v2_freshness_policy.json
          if-no-files-found: error
          retention-days: 30

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only Oracle V2 freshness-governance evidence only."
          echo "Policy values are explicit and provenance-bearing; live slot ages did not select them."
          echo "Freshness is separate from price correctness and source independence."
          echo "Five relay slots are same-system redundancy, not five independent market sources."
          echo "No current-price, provider, public-service, Scout, or execution promotion."
