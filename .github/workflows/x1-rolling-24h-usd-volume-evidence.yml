name: X1 Rolling 24h USD Volume Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  usd-volume-evidence:
    name: Prove nonzero X1 rolling 24h USD valuation
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/504-nonzero-usd-volume'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify X1.Ninja key
        shell: bash
        run: |
          if [ -z "${X1_NINJA_API_KEY:-}" ]; then
            echo "X1_NINJA_API_KEY repository secret is unavailable."
            exit 1
          fi

      - name: Probe #504 exact trade and historical XNT price evidence
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          from liquidity_scout.providers.x1.history_range import scan_address_history_range
          from liquidity_scout.providers.x1.market import fetch_all_pools
          from liquidity_scout.providers.x1.ninja_price_fact_time import (
              collect_ninja_price_fact_time_snapshot,
          )
          from liquidity_scout.providers.x1.ninja_history import (
              fetch_pool_ohlcv_raw,
              fetch_pool_trades_raw,
          )
          from liquidity_scout.providers.x1.transaction_semantics import (
              fetch_transaction,
              report_to_dict,
              verify_signature,
              verify_transaction,
          )
          from liquidity_scout.providers.x1.xdex import fetch_price_history
          from liquidity_scout.providers.x1.xdex_price_history_import import (
              USDC_X_MINT,
              WRAPPED_XNT_MINT,
          )

          TARGET_POOL = "CKtXmX82rLBqNkfpCBPUoHLmtZhgBdVWpVPW93hHHCCK"
          TARGET_SIG = "2uWfa2LJcjo5qo916N9Ce7aUuu5xKctez9pL3NDCgzgAqUpQ7JZqZGKP4UtfyzmYiVWn6oJWifRhvqM6QDFPvynK"
          TARGET_TIME = 1788618043
          REFERENCE_POOL = "CAJeVEoSm1QQZccnCqYu9cnNF7TTD2fcUA3E5HQoxRvR"

          tx = report_to_dict(
              verify_signature(
                  TARGET_SIG,
                  expected_mint="Dj7AY5CXLHtcT5gZ59Kg3nYgx4FUNMR38dZdQcGT3PA6",
              )
          )
          trades = fetch_pool_trades_raw(TARGET_POOL)
          target_rows = [
              row
              for row in (trades.get("raw_response") or {}).get("trades", [])
              if isinstance(row, dict) and row.get("txHash") == TARGET_SIG
          ]

          xdex_history = fetch_price_history(
              WRAPPED_XNT_MINT,
              USDC_X_MINT,
              time_from=TARGET_TIME - 300,
              time_to=TARGET_TIME + 300,
          )
          ninja_reference = fetch_pool_ohlcv_raw(
              REFERENCE_POOL,
              timeframe="1m",
              limit=300,
          )
          catalog, xnt_price_usd = fetch_all_pools(sleep_seconds=0)
          reference_snapshot = collect_ninja_price_fact_time_snapshot(
              pool_addresses=[REFERENCE_POOL]
          )
          reference_snapshot_rows = [
              row
              for row in (reference_snapshot.get("pools") or [])
              if isinstance(row, dict)
              and row.get("pool_address") == REFERENCE_POOL
              and row.get("status") == "ok"
          ]
          reference_chain_anchor = None
          if reference_snapshot_rows:
              rrpc = reference_snapshot_rows[0].get("rpc") or {}
              vault0 = rrpc.get("vault_0")
              vault1 = rrpc.get("vault_1")
              mint0 = rrpc.get("mint_0")
              mint1 = rrpc.get("mint_1")
              history = scan_address_history_range(
                  REFERENCE_POOL,
                  start_epoch=TARGET_TIME - 3600,
                  end_epoch=TARGET_TIME,
                  max_signatures=5000,
              )
              classified_newer_entries = 0
              latest_mutation = None
              for entry in history.get("entries") or []:
                  bt = entry.get("block_time")
                  if (
                      entry.get("err") is not None
                      or bt is None
                      or float(bt) > TARGET_TIME
                      or float(bt) < TARGET_TIME - 3600
                  ):
                      continue
                  raw_tx = fetch_transaction(entry["signature"])
                  report = report_to_dict(
                      verify_transaction(
                          raw_tx,
                          signature=entry["signature"],
                          rpc_url="https://rpc.mainnet.x1.xyz",
                      )
                  )
                  by_account = {
                      row.get("account"): row
                      for row in report.get("token_deltas") or []
                      if isinstance(row, dict)
                  }
                  d0 = by_account.get(vault0)
                  d1 = by_account.get(vault1)
                  exact_mutation = (
                      report.get("found") is True
                      and report.get("succeeded") is True
                      and report.get("xdex_amm_invoked") is True
                      and isinstance(d0, dict)
                      and isinstance(d1, dict)
                      and d0.get("mint") == mint0
                      and d1.get("mint") == mint1
                  )
                  if exact_mutation:
                      latest_mutation = {
                          "signature": entry["signature"],
                          "slot": report.get("slot"),
                          "block_time": report.get("block_time"),
                          "vault_0": vault0,
                          "mint_0": mint0,
                          "pre_0": d0.get("pre_ui"),
                          "post_0": d0.get("post_ui"),
                          "delta_0": d0.get("delta_ui"),
                          "vault_1": vault1,
                          "mint_1": mint1,
                          "pre_1": d1.get("pre_ui"),
                          "post_1": d1.get("post_ui"),
                          "delta_1": d1.get("delta_ui"),
                      }
                      break
                  classified_newer_entries += 1
              if latest_mutation is not None:
                  reference_chain_anchor = {
                      "history_range_proven": history.get("range_proven"),
                      "history_integrity_verified": history.get("integrity_verified"),
                      "latest_pool_vault_mutation_before_target": latest_mutation,
                      "newer_pool_address_entries_classified_without_exact_two_vault_mutation": classified_newer_entries,
                  }

          ref_rows = [
              row
              for row in catalog
              if isinstance(row, dict)
              and (row.get("address") or row.get("poolAddress") or row.get("id"))
              == REFERENCE_POOL
          ]
          target_pool_rows = [
              row
              for row in catalog
              if isinstance(row, dict)
              and (row.get("address") or row.get("poolAddress") or row.get("id"))
              == TARGET_POOL
          ]
          current_mark_expected = 6.404425898 * float(xnt_price_usd)

          result = {
              "schema": "x1_504_probe.v1",
              "target_transaction": tx,
              "target_trade_rows": target_rows,
              "xdex_xnt_usdcx_history": xdex_history,
              "ninja_xnt_usdcx_ohlcv": ninja_reference,
              "current_reference_pool_rows": ref_rows,
              "reference_chain_anchor_before_target": reference_chain_anchor,
              "current_target_pool_rows": target_pool_rows,
              "current_ninja_xnt_price_usd": xnt_price_usd,
              "diagnostic_exact_quote_volume_x_current_ninja_xnt_usd": current_mark_expected,
              "target_time": TARGET_TIME,
              "historical_usdcx_usd_equivalence_verified": False,
              "execution_authorized": False,
          }
          print("X1 #504 FACT-TIME VALUATION PROBE")
          print(json.dumps(result, sort_keys=True, default=str))
          assert tx["found"] is True
          assert tx["succeeded"] is True
          assert tx["block_time"] == TARGET_TIME
          assert target_rows, "target Ninja trade row unavailable"
          assert target_pool_rows, "target current pool row unavailable"
          assert xdex_history, "XDEX XNT/USDC.X historical window unavailable"
          PY

      - name: Observe #504 exact-pool reconciliation behavior
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import time

          from liquidity_scout.providers.x1.ninja_history import fetch_pool_trades_raw
          from liquidity_scout.providers.x1.ninja_pool_detail import fetch_pool_detail_raw

          TARGET_POOL = "CKtXmX82rLBqNkfpCBPUoHLmtZhgBdVWpVPW93hHHCCK"
          TARGET_SIG = "2uWfa2LJcjo5qo916N9Ce7aUuu5xKctez9pL3NDCgzgAqUpQ7JZqZGKP4UtfyzmYiVWn6oJWifRhvqM6QDFPvynK"
          REFERENCE_POOL = "CAJeVEoSm1QQZccnCqYu9cnNF7TTD2fcUA3E5HQoxRvR"
          snapshots = []

          def unwrap_pool(body):
              if not isinstance(body, dict):
                  return None
              if any(
                  key in body
                  for key in ("priceUsd", "volume24h", "txns24h", "lastSyncedAt")
              ):
                  return body
              for name in ("data", "pool", "result"):
                  value = body.get(name)
                  if isinstance(value, dict) and any(
                      key in value
                      for key in ("priceUsd", "volume24h", "txns24h", "lastSyncedAt")
                  ):
                      return value
              return None

          for index in range(8):
              target_probe = fetch_pool_detail_raw(TARGET_POOL)
              reference_probe = fetch_pool_detail_raw(REFERENCE_POOL)
              trades = fetch_pool_trades_raw(TARGET_POOL)
              target = unwrap_pool(target_probe.get("raw_response"))
              reference = unwrap_pool(reference_probe.get("raw_response"))
              trade = next(
                  (
                      row
                      for row in (trades.get("raw_response") or {}).get("trades", [])
                      if isinstance(row, dict) and row.get("txHash") == TARGET_SIG
                  ),
                  None,
              )
              if (
                  not isinstance(target, dict)
                  or not isinstance(reference, dict)
                  or not isinstance(trade, dict)
              ):
                  raise AssertionError("target/reference/trade evidence disappeared")

              native = float(trade["amountNative"])
              reference_xnt_usd = float(reference["priceUsd"])
              snapshots.append({
                  "index": index,
                  "observed_at": time.time(),
                  "pool_lastSyncedAt": target.get("lastSyncedAt"),
                  "pool_volume24h": target.get("volume24h"),
                  "pool_txns24h": target.get("txns24h"),
                  "trade_amountNative": trade.get("amountNative"),
                  "trade_amountUsd": trade.get("amountUsd"),
                  "trade_priceUsd": trade.get("priceUsd"),
                  "reference_xnt_priceUsd": reference.get("priceUsd"),
                  "reference_lastSyncedAt": reference.get("lastSyncedAt"),
                  "quote_x_reference_xnt_usd": native * reference_xnt_usd,
                  "pool_volume_minus_current_reference_mark": (
                      float(target["volume24h"]) - native * reference_xnt_usd
                  ),
                  "trade_amount_usd_minus_current_reference_mark": (
                      float(trade["amountUsd"]) - native * reference_xnt_usd
                  ),
              })
              if index < 7:
                  time.sleep(10)

          def changed(field):
              return len({str(row[field]) for row in snapshots}) > 1

          result = {
              "schema": "x1_504_exact_pool_reconciliation_series.v2",
              "snapshots": snapshots,
              "pool_volume_changed": changed("pool_volume24h"),
              "trade_amount_usd_changed": changed("trade_amountUsd"),
              "reference_xnt_price_usd_changed": changed("reference_xnt_priceUsd"),
              "pool_lastSyncedAt_changed": changed("pool_lastSyncedAt"),
              "reference_lastSyncedAt_changed": changed("reference_lastSyncedAt"),
              "provider_fact_time_verified": False,
              "volume_usd_semantics_verified": False,
              "execution_authorized": False,
          }
          print("X1 #504 EXACT-POOL RECONCILIATION SERIES")
          print(json.dumps(result, sort_keys=True, default=str))
          assert len(snapshots) == 8
          assert all(row["pool_txns24h"] == 1 for row in snapshots)
          PY

      - name: Discover reconciled nonzero XNT-volume candidate
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          import json
          import time
          from datetime import datetime, timezone

          from liquidity_scout.market.resolver import find_matches_for_term, pool_address
          from liquidity_scout.providers.x1.market import fetch_all_pools
          from liquidity_scout.providers.x1.ninja_history import fetch_pool_trades_raw
          from liquidity_scout.providers.x1.xdex_price_history_import import WRAPPED_XNT_MINT

          now = time.time()
          start = now - 86400
          pools, xnt_price_usd = fetch_all_pools(sleep_seconds=0)

          def text(value):
              value = str(value or "").strip()
              return value or None

          def mint(token):
              if not isinstance(token, dict):
                  return None
              return text(token.get("mint") or token.get("address"))

          def epoch(value):
              if not isinstance(value, str):
                  return None
              try:
                  return datetime.fromisoformat(
                      value.replace("Z", "+00:00")
                  ).astimezone(timezone.utc).timestamp()
              except ValueError:
                  return None

          candidates = []
          for pool in pools:
              if not isinstance(pool, dict):
                  continue
              address = text(pool_address(pool))
              if not address:
                  continue
              raw_txs = pool.get("txns24h")
              try:
                  txs = int(raw_txs)
              except (TypeError, ValueError):
                  continue
              if txs < 1 or txs > 8 or float(raw_txs) != txs:
                  continue

              base = mint(pool.get("baseToken"))
              quote = mint(pool.get("quoteToken"))
              if base == WRAPPED_XNT_MINT and quote and quote != WRAPPED_XNT_MINT:
                  asset = quote
              elif quote == WRAPPED_XNT_MINT and base and base != WRAPPED_XNT_MINT:
                  asset = base
              else:
                  continue

              matches = [
                  match
                  for match in find_matches_for_term(asset, pools)
                  if len(match) >= 4 and match[3] >= 90
              ]
              matched_addresses = []
              seen = set()
              for match in matches:
                  a = text(pool_address(match[0]))
                  if a and a not in seen:
                      seen.add(a)
                      matched_addresses.append(a)
              if matched_addresses != [address]:
                  continue

              try:
                  trade_observation = fetch_pool_trades_raw(address)
              except Exception:
                  continue
              rows = []
              for row in (trade_observation.get("raw_response") or {}).get("trades", []):
                  if not isinstance(row, dict):
                      continue
                  ts = epoch(row.get("timestamp"))
                  if ts is None or ts < start or ts > now:
                      continue
                  if str(row.get("type") or "").lower() not in {"buy", "sell"}:
                      continue
                  try:
                      native = abs(float(row["amountNative"]))
                      usd = abs(float(row["amountUsd"]))
                  except (TypeError, ValueError, KeyError):
                      continue
                  rows.append({
                      "txHash": row.get("txHash"),
                      "timestamp": row.get("timestamp"),
                      "type": row.get("type"),
                      "amountNative": native,
                      "amountUsd": usd,
                  })

              if len({row["txHash"] for row in rows if row["txHash"]}) != txs:
                  continue
              native_sum = sum(row["amountNative"] for row in rows)
              usd_sum = sum(row["amountUsd"] for row in rows)
              current_mark = native_sum * float(xnt_price_usd)
              provider_volume = float(pool.get("volume24h") or 0)
              tolerance = max(0.01, abs(provider_volume) * 0.01)
              trade_rows_match_pool = abs(provider_volume - usd_sum) <= tolerance
              current_mark_matches_pool = abs(provider_volume - current_mark) <= tolerance
              trade_rows_use_current_mark = abs(usd_sum - current_mark) <= tolerance

              candidates.append({
                  "pool_address": address,
                  "asset_mint": asset,
                  "provider_transactions_24h": txs,
                  "provider_volume24h": provider_volume,
                  "trade_row_count_24h": len(rows),
                  "trade_row_native_sum": native_sum,
                  "trade_row_usd_sum": usd_sum,
                  "current_xnt_price_usd": xnt_price_usd,
                  "native_sum_x_current_xnt_usd": current_mark,
                  "trade_rows_match_pool_volume": trade_rows_match_pool,
                  "current_mark_matches_pool_volume": current_mark_matches_pool,
                  "trade_rows_use_current_mark": trade_rows_use_current_mark,
                  "lastSyncedAt": pool.get("lastSyncedAt"),
                  "rows": rows,
              })

          reconciled = [
              row
              for row in candidates
              if row["trade_rows_match_pool_volume"]
              and row["current_mark_matches_pool_volume"]
              and row["trade_rows_use_current_mark"]
          ]
          reconciled.sort(
              key=lambda row: (
                  row["provider_transactions_24h"],
                  -row["provider_volume24h"],
                  row["pool_address"],
              )
          )

          result = {
              "schema": "x1_504_reconciled_candidate_discovery.v1",
              "candidate_count": len(candidates),
              "reconciled_candidate_count": len(reconciled),
              "reconciled_candidates": reconciled[:10],
              "all_candidates": candidates[:30],
              "provider_trade_range_completeness_verified": False,
              "chain_reconstruction_verified": False,
              "current_usd_basis_independently_verified": False,
              "execution_authorized": False,
          }
          print("X1 #504 RECONCILED NONZERO CANDIDATE DISCOVERY")
          print(json.dumps(result, sort_keys=True, default=str))
          assert candidates, "no bounded low-activity XNT markets available"
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only evidence only."
          echo "No current-price substitution."
          echo "No nearest-candle substitution is authorized."
          echo "Historical USDC.X/USD equivalence remains a separate required gate."
          echo "execution_authorized=false"
