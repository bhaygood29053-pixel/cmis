name: Apply CMIS 1.30 Tokenized Equity Promotion

on:
  push:
    branches:
      - feat/674-cmis-130-tokenized-equity-promotion
    paths:
      - ".github/workflows/apply-cmis-130-tokenized-promotion.yml"

permissions:
  contents: write

jobs:
  apply-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/674-cmis-130-tokenized-equity-promotion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply deterministic public promotion migration
        run: python scripts/apply_cmis_130_tokenized_promotion.py
      - name: Static promotion sanity
        run: |
          python -m compileall -q liquidity_scout/cmis liquidity_scout/services
          python - <<'PY'
          from liquidity_scout import cmis
          from liquidity_scout.cmis.capabilities import CMIS_CONTRACT_VERSION, PUBLIC_RUNTIME_SERVICES
          from liquidity_scout.services.cmis_tokenized_equity_intelligence import PROMOTED
          assert CMIS_CONTRACT_VERSION == "1.30.0"
          assert tuple(cmis.SUPPORTED_SERVICES) == tuple(PUBLIC_RUNTIME_SERVICES)
          assert PUBLIC_RUNTIME_SERVICES[-3:] == (
              "x1_intelligence_brief_inputs",
              "tokenized_equity_intelligence",
              "wallet_relationship_intelligence",
          )
          assert PROMOTED is True
          PY
          git diff --check
      - name: Commit and push migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            liquidity_scout/cmis/capabilities.py \
            liquidity_scout/cmis/__init__.py \
            liquidity_scout/services/cmis_tokenized_equity_intelligence.py \
            tests/test_cmis_capabilities.py \
            tests/test_cmis_http_gateway.py \
            tests/test_cmis_wallet_relationship_capability_v128.py \
            tests/test_cmis_x1_intelligence_brief_capability_v129.py \
            tests/test_cmis_tokenized_equity_intelligence_contract.py
          git commit -m "feat: promote Tokenized Equity Intelligence in CMIS 1.30"
          git push origin HEAD:feat/674-cmis-130-tokenized-equity-promotion
