name: Apply CMIS 1.30 Tokenized Equity Promotion

on:
  push:
    branches:
      - feat/674-cmis-130-tokenized-equity-promotion
    paths:
      - ".github/workflows/apply-cmis-130-tokenized-promotion.yml"

permissions:
  contents: write

jobs:
  migrate-release-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/674-cmis-130-tokenized-equity-promotion
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply broad release-workflow migration
        run: python scripts/apply_cmis_130_tests_workflow.py
      - name: Validate workflow migration
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/tests.yml").read_text(encoding="utf-8")
          assert 'Validate CMIS 1.30 capability' in text
          assert 'CMIS_CONTRACT_VERSION = "1.30.0"' in text
          assert '"tokenized_equity_intelligence"' in text
          assert 'test_cmis_tokenized_equity_capability_v130.py' in text
          assert 'CMIS_130_REGRESSION_EXPECTATIONS=PASS' in text
          PY
          git diff --check
      - name: Commit broad workflow migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/tests.yml
          git commit -m "ci: align broad regression with CMIS 1.30"
          git push origin HEAD:feat/674-cmis-130-tokenized-equity-promotion
