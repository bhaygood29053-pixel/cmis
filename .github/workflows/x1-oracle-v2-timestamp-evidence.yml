name: X1 Oracle V2 Timestamp Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  oracle-v2-timestamp-evidence:
    name: Read-only Oracle V2 timestamp-unit evidence
    if: github.head_ref == 'agent/issue283-oracle-v2-timestamp-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run deterministic timestamp evidence tests
        run: |
          python -m unittest tests.test_x1_oracle_v2_timestamp_unit_probe -v

      - name: Collect live read-only timestamp evidence
        id: live_probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python cmis_x1_oracle_v2_timestamp_unit_probe.py \
            --history-limit 25 \
            --output x1-oracle-v2-timestamp-evidence.json \
            | tee x1-oracle-v2-timestamp-evidence.log

      - name: Upload sanitized timestamp evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: x1-oracle-v2-timestamp-evidence-${{ github.run_id }}
          path: |
            x1-oracle-v2-timestamp-evidence.json
            x1-oracle-v2-timestamp-evidence.log
          if-no-files-found: error
          retention-days: 14

      - name: Enforce evidence collection
        if: steps.live_probe.outcome != 'success'
        run: |
          echo "Oracle V2 timestamp evidence collection did not produce a verified batch sample."
          exit 1

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1 history/getTransaction/getBlockTime calls only."
          echo "No correlation tolerance is supplied by CI."
          echo "Raw candidate Unix-ms differences are evidence, not timestamp-unit verification."
          echo "No freshness, price correctness, provider, Scout, or execution promotion."
