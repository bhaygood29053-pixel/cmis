name: XDEX On-chain Slippage Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  xdex-onchain-slippage-evidence:
    name: Decode real XDEX minimum-output semantics
    if: github.head_ref == 'agent/xdex-onchain-slippage-evidence'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_XDEX_ONCHAIN_SLIPPAGE_LIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Decode successful XDEX swaps from X1 RPC
        run: |
          python -m unittest \
            tests.test_xdex_onchain_slippage_semantics_live \
            tests.test_xdex_slippage_layering_pinned_live \
            tests.test_xdex_cross_transaction_half_percent_live \
            -v

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1 RPC transaction/history evidence only."
          echo "No quote preparation, signing, broadcasting, custody, swap execution, or value movement."
