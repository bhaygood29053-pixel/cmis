name: XONE XNT X1 Binding Discovery

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_x1_binding_discovery.py'
      - 'scripts/discover_xone_xnt_x1_binding.py'
      - 'docs/XONE_XNT_X1_BINDING_DISCOVERY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-x1-binding-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_x1_binding_discovery.py'
      - 'scripts/discover_xone_xnt_x1_binding.py'
      - 'docs/XONE_XNT_X1_BINDING_DISCOVERY_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-x1-binding-discovery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test exact X1 binding discovery
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_x1_binding_discovery.py
      - name: Re-run X1 XNT mechanism boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_xnt_distribution_mechanism_discovery.py
      - name: Re-run XONE/XNT candidate boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_candidate_discovery.py
      - name: Re-run dedicated scraper boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py

  live-binding-discovery:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Discover bounded XONE/XNT X1 binding candidates
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/discover_xone_xnt_x1_binding.py             --x1report-max-urls 20             --max-candidates 25             --history-limit 25             --transaction-limit 10             | tee evidence/xone-xnt-x1-binding-discovery.json

          python - <<'PY'
          import json

          path = "evidence/xone-xnt-x1-binding-discovery.json"
          data = json.load(open(path))
          assert data["status"] == "PASS"
          assert data["contract_version"] == "xone_xnt_x1_binding_discovery/v1"
          assert data["source_gate_passed"] is True
          assert data["candidate_qualification_gate_passed"] is True
          assert data["sources"]["official_available_count"] >= 2
          assert data["sources"]["rewards_page_available"] is True
          assert data["sources"]["x1report"]["available"] is True
          assert data["sources"]["x1report"]["pages_attempted"] > 0
          assert data["sources"]["x1report"]["pages_available"] > 0

          discovery = data["candidate_discovery"]
          assert discovery["x1_binding_candidate_discovery_verified"] is True
          if discovery["candidate_count"] == 0:
              assert discovery[
                  "zero_candidates_mean_only_no_exact_x1_binding_pubkeys_in_supplied_claims"
              ] is True
              assert data["zero_candidates_are_scoped_corpus_evidence_only"] is True
          else:
              assert not data["qualification_errors"]
              for proof in data["candidate_qualifications"]:
                  if proof["qualification_state"] == "bounded_history_observed":
                      assert proof["bounded_history_verified"] is True
                      assert proof["candidate_role_verified"] is False
                      assert proof["x1_binding_identified"] is False

          assert data["x1_binding_identified"] is False
          assert data["xnt_distribution_mechanism_identified"] is False
          assert data["xnt_issuance_verified"] is False
          assert data["xnt_vesting_or_unlock_verified"] is False
          assert data["xone_xnt_conversion_verified"] is False
          assert data["cross_chain_correlation_verified"] is False
          assert data["public_service_promoted"] is False
          assert data["scout_reliance_promoted"] is False
          assert data["execution_authorized"] is False

          print(f"BOUNDED_XONE_XNT_CLAIMS={data['bounded_claim_count']}")
          print(f"EXACT_X1_BINDING_CANDIDATES={discovery['candidate_count']}")
          print("X1_BINDING_IDENTIFIED=FALSE")
          print("XONE_XNT_CONVERSION_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xone-xnt-x1-binding-discovery-evidence
          path: evidence/xone-xnt-x1-binding-discovery.json
          if-no-files-found: error
