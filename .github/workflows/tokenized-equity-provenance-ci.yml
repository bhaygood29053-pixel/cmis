name: Tokenized Equity Provenance v1

on:
  pull_request:
    branches:
      - main
    paths:
      - "liquidity_scout/services/cmis_tokenized_equity_provenance.py"
      - "liquidity_scout/services/cmis_cross_chain_provenance.py"
      - "tests/test_cmis_tokenized_equity_provenance.py"
      - "docs/TOKENIZED_EQUITY_PROVENANCE_V1.md"
      - ".github/workflows/tokenized-equity-provenance-ci.yml"
  push:
    branches:
      - main
    paths:
      - "liquidity_scout/services/cmis_tokenized_equity_provenance.py"
      - "liquidity_scout/services/cmis_cross_chain_provenance.py"
      - "tests/test_cmis_tokenized_equity_provenance.py"
      - "docs/TOKENIZED_EQUITY_PROVENANCE_V1.md"
      - ".github/workflows/tokenized-equity-provenance-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out CMIS
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile bounded provenance modules
        run: |
          python -m compileall -q \
            liquidity_scout/services/cmis_cross_chain_provenance.py \
            liquidity_scout/services/cmis_tokenized_equity_provenance.py

      - name: Test tokenized equity provenance v1
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q \
            tests/test_cmis_cross_chain_provenance.py \
            tests/test_cmis_robinhood_x1_provenance.py \
            tests/test_cmis_tokenized_equity_provenance.py
