name: XDEX Output Slippage Semantic Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  output-slippage-probe:
    name: Read-only XDEX output/slippage localization
    if: github.head_ref == 'agent/xdex-output-slippage-semantics'
    runs-on: ubuntu-latest
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install runtime requirements
        run: python -m pip install -r requirements.txt

      - name: Compare Oracle sell quote, swap quote, and verified CP curve
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_output_slippage_semantics_live -v

      - name: Probe quote slippage parameter semantics
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_quote_slippage_parameter_live -v

      - name: Decode completed XDEX swap minimum-output instruction
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_executed_swap_minimum_out_live -v

      - name: Inspect deployed XDEX frontend quote bundle
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_frontend_quote_bundle_live -v

      - name: Compare deployed frontend and research quote routes
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_frontend_quote_route_live -v

      - name: Verify quote honors explicit AMM config selector
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_forced_config_quote_live -v

      - name: Probe second XDEX market for effective fee localization
        env:
          RUN_XDEX_OUTPUT_SLIPPAGE_LIVE: '1'
        run: python -m unittest tests.test_xdex_second_pool_effective_fee_live -v

      - name: Safety boundary
        if: always()
        run: |
          echo 'Read-only HTTP GET, historical transaction inspection, and X1 RPC reads only.'
          echo 'No /swap/prepare, transaction construction, signing, broadcasting, custody, execution, or value movement.'