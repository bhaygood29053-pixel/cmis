name: Apply Wallet Relationship 1.28 promotion

on:
  push:
    branches:
      - feat/wallet-relationship-capability-promotion-631
    paths:
      - ".github/workflows/apply-wallet-relationship-promotion-631.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/wallet-relationship-capability-promotion-631

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply bounded public promotion
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement anchor, found {count}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          capabilities = "liquidity_scout/cmis/capabilities.py"
          replace_once(
              capabilities,
              '''from liquidity_scout.services.cmis_regulatory_evidence import (
              CONTRACT_VERSION as REGULATORY_EVIDENCE_CONTRACT_VERSION,
              SERVICE as REGULATORY_EVIDENCE_SERVICE,
          )
          ''',
              '''from liquidity_scout.services.cmis_regulatory_evidence import (
              CONTRACT_VERSION as REGULATORY_EVIDENCE_CONTRACT_VERSION,
              SERVICE as REGULATORY_EVIDENCE_SERVICE,
          )
          from liquidity_scout.services.cmis_wallet_relationship_intelligence import (
              CONTRACT_VERSION as WALLET_RELATIONSHIP_CONTRACT_VERSION,
              SERVICE as WALLET_RELATIONSHIP_SERVICE,
          )
          from liquidity_scout.services.cmis_wallet_relationship_request import (
              REQUEST_CONTRACT_VERSION as WALLET_RELATIONSHIP_REQUEST_CONTRACT_VERSION,
          )
          ''',
          )
          replace_once(
              capabilities,
              'CMIS_CONTRACT_VERSION = "1.27.0"',
              'CMIS_CONTRACT_VERSION = "1.28.0"',
          )
          replace_once(
              capabilities,
              '''    "regulatory_evidence",
          )
          PUBLIC_SUPPORTED_CHAINS''',
              '''    "regulatory_evidence",
              "wallet_relationship_intelligence",
          )
          PUBLIC_SUPPORTED_CHAINS''',
          )

          helper = '''def _wallet_relationship_capability(*, available: bool) -> dict[str, Any]:
              if not available:
                  return {
                      "state": "unavailable",
                      "callable": False,
                      "read_only": True,
                      "public_service_promoted": False,
                      "scout_reliance_promoted": False,
                      "service_contract_version": WALLET_RELATIONSHIP_CONTRACT_VERSION,
                      "request_contract_version": WALLET_RELATIONSHIP_REQUEST_CONTRACT_VERSION,
                      "materialization_contract_version": "x1_direct_wallet_transfer_materialization/v1",
                      "requirements": [],
                      "limitations": ["wallet_relationship_intelligence_not_available_for_chain"],
                      "observed_relationships_only": True,
                      "ownership_inference_authorized": False,
                      "beneficial_ownership_inference_authorized": False,
                      "behavior_or_intent_inference_authorized": False,
                      "risk_inference_authorized": False,
                      "complete_history_claim_authorized": False,
                      "complete_graph_coverage_claim_authorized": False,
                      "evidence_receipt_binding_available": False,
                      "proof_score_binding_available": False,
                      "proof_score_separate_from_risk": True,
                      "execution_authorized": False,
                  }
              return {
                  "state": "bounded",
                  "callable": True,
                  "read_only": True,
                  "public_service_promoted": True,
                  "scout_reliance_promoted": True,
                  "service_contract_version": WALLET_RELATIONSHIP_CONTRACT_VERSION,
                  "request_contract_version": WALLET_RELATIONSHIP_REQUEST_CONTRACT_VERSION,
                  "materialization_contract_version": "x1_direct_wallet_transfer_materialization/v1",
                  "requirements": [
                      "exact_x1_transaction_signature",
                      "exact_x1_asset_mint_identity",
                      "exact_sender_wallet_identity",
                      "exact_recipient_wallet_identity",
                      "cmis_owned_finalized_x1_transaction_resolution",
                      "verified_direct_spl_token_transfer",
                      "exact_token_account_owner_binding",
                      "exact_transfer_direction",
                      "exact_raw_amount_and_decimals",
                      "canonical_transaction_fact_time",
                      "content_addressed_wallet_activity_observation",
                      "content_addressed_direct_relationship_evidence",
                      "caller_fact_evidence_provider_injection_rejected",
                  ],
                  "limitations": [
                      "observed_direct_interaction_only",
                      "relationship_is_transaction_scoped_not_complete_history",
                      "transfer_does_not_prove_common_ownership",
                      "transfer_does_not_prove_beneficial_ownership",
                      "wallet_address_is_not_real_world_identity",
                      "transfer_does_not_prove_insider_whale_bot_or_market_maker",
                      "behavior_or_intent_not_inferred",
                      "coordination_manipulation_or_fraud_not_inferred",
                      "sequence_or_transfer_does_not_establish_causality",
                      "risk_severity_not_inferred",
                      "evidence_receipt_binding_unavailable_in_v1",
                      "proof_score_binding_unavailable_in_v1",
                      "proof_score_separate_from_risk",
                      "complete_wallet_history_not_proven",
                      "complete_relationship_graph_not_proven",
                      "missing_evidence_is_unknown_not_zero",
                      "no_execution_authorization",
                      "x1_only_initial_scope",
                  ],
                  "observed_relationships_only": True,
                  "ownership_inference_authorized": False,
                  "beneficial_ownership_inference_authorized": False,
                  "behavior_or_intent_inference_authorized": False,
                  "risk_inference_authorized": False,
                  "complete_history_claim_authorized": False,
                  "complete_graph_coverage_claim_authorized": False,
                  "evidence_receipt_binding_available": False,
                  "proof_score_binding_available": False,
                  "proof_score_separate_from_risk": True,
                  "execution_authorized": False,
              }


          '''
          replace_once(
              capabilities,
              'def _promoted_concentration_intelligence_capability(*, available: bool) -> dict[str, Any]:',
              helper + 'def _promoted_concentration_intelligence_capability(*, available: bool) -> dict[str, Any]:',
          )
          replace_once(
              capabilities,
              '''        REGULATORY_EVIDENCE_SERVICE: _regulatory_evidence_capability(
                      available=True
                  ),
              },
              "solana": {''',
              '''        REGULATORY_EVIDENCE_SERVICE: _regulatory_evidence_capability(
                      available=True
                  ),
                  WALLET_RELATIONSHIP_SERVICE: _wallet_relationship_capability(available=True),
              },
              "solana": {''',
          )
          replace_once(
              capabilities,
              '''        REGULATORY_EVIDENCE_SERVICE: _regulatory_evidence_capability(
                      available=False
                  ),
              },
          }
          ''',
              '''        REGULATORY_EVIDENCE_SERVICE: _regulatory_evidence_capability(
                      available=False
                  ),
                  WALLET_RELATIONSHIP_SERVICE: _wallet_relationship_capability(available=False),
              },
          }
          ''',
          )

          replace_once(
              "liquidity_scout/cmis/__init__.py",
              '''    "regulatory_evidence",
          )
          SUPPORTED_CHAINS''',
              '''    "regulatory_evidence",
              "wallet_relationship_intelligence",
          )
          SUPPORTED_CHAINS''',
          )

          replace_once(
              "tests/test_cmis_capabilities.py",
              'self.assertEqual(CMIS_CONTRACT_VERSION, "1.27.0")',
              'self.assertEqual(CMIS_CONTRACT_VERSION, "1.28.0")',
          )
          replace_once(
              "tests/test_cmis_capabilities.py",
              '        self.assertIn(REGULATORY_EVIDENCE_SERVICE, SUPPORTED_SERVICES)\n',
              '        self.assertIn(REGULATORY_EVIDENCE_SERVICE, SUPPORTED_SERVICES)\n        self.assertIn("wallet_relationship_intelligence", SUPPORTED_SERVICES)\n',
          )

          replace_once(
              "tests/test_cmis_http_gateway.py",
              'self.assertEqual(response["contract_version"], "1.27.0")',
              'self.assertEqual(response["contract_version"], "1.28.0")',
          )
          replace_once(
              "tests/test_cmis_http_gateway.py",
              'self.assertEqual(len(response["supported_services"]), 20)',
              'self.assertEqual(len(response["supported_services"]), 21)',
          )
          replace_once(
              "tests/test_cmis_http_gateway.py",
              '        self.assertIn("regulatory_evidence", response["supported_services"])\n',
              '        self.assertIn("regulatory_evidence", response["supported_services"])\n        self.assertIn("wallet_relationship_intelligence", response["supported_services"])\n',
          )
          replace_once(
              "tests/test_cmis_http_gateway.py",
              '''        self.assertFalse(promoted["execution_authorized"])

                  self.assertEqual(solana["asset_lookup"]["state"], "bounded")''',
              '''        self.assertFalse(promoted["execution_authorized"])

                  wallet_relationship = x1["wallet_relationship_intelligence"]
                  self.assertEqual(wallet_relationship["state"], "bounded")
                  self.assertTrue(wallet_relationship["callable"])
                  self.assertTrue(wallet_relationship["read_only"])
                  self.assertTrue(wallet_relationship["public_service_promoted"])
                  self.assertTrue(wallet_relationship["scout_reliance_promoted"])
                  self.assertTrue(wallet_relationship["observed_relationships_only"])
                  self.assertFalse(wallet_relationship["ownership_inference_authorized"])
                  self.assertFalse(wallet_relationship["risk_inference_authorized"])
                  self.assertFalse(wallet_relationship["execution_authorized"])
                  self.assertEqual(solana["wallet_relationship_intelligence"]["state"], "unavailable")
                  self.assertFalse(solana["wallet_relationship_intelligence"]["callable"])
                  self.assertFalse(solana["wallet_relationship_intelligence"]["execution_authorized"])

                  self.assertEqual(solana["asset_lookup"]["state"], "bounded")''',
          )

          workflow = ".github/workflows/tests.yml"
          replace_once(
              workflow,
              '''              "regulatory_evidence",
                    )''',
              '''              "regulatory_evidence",
                        "wallet_relationship_intelligence",
                    )''',
          )
          replace_once(
              workflow,
              'Validate CMIS 1.27 capability and Instant X1 Scan v6 history contract',
              'Validate CMIS 1.28 capability and Instant X1 Scan v6 history contract',
          )
          replace_once(
              workflow,
              'assert \'CMIS_CONTRACT_VERSION = "1.27.0"\' in capabilities',
              'assert \'CMIS_CONTRACT_VERSION = "1.28.0"\' in capabilities',
          )
          replace_once(
              workflow,
              '''          assert '"push_delivery_authorized": False' in capabilities
                    assert '"watch_clear_are_not_risk_severity"' in capabilities
          ''',
              '''          assert '"push_delivery_authorized": False' in capabilities
                    assert '"watch_clear_are_not_risk_severity"' in capabilities
                    assert 'WALLET_RELATIONSHIP_SERVICE' in capabilities
                    assert 'WALLET_RELATIONSHIP_REQUEST_CONTRACT_VERSION' in capabilities
                    assert '"observed_relationships_only": True' in capabilities
                    assert '"ownership_inference_authorized": False' in capabilities
                    assert '"risk_inference_authorized": False' in capabilities
                    assert '"execution_authorized": False' in capabilities
          ''',
          )
          replace_once(
              workflow,
              'Validate CMIS 1.27 regression expectations',
              'Validate CMIS 1.28 regression expectations',
          )
          replace_once(
              workflow,
              '''          assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.27.0")' in capabilities_test
                    assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.26.0")' not in capabilities_test''',
              '''          assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.28.0")' in capabilities_test
                    assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.27.0")' not in capabilities_test
                    assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.26.0")' not in capabilities_test''',
          )
          replace_once(
              workflow,
              '''          assert 'response["contract_version"], "1.27.0"' in http_test
                    assert 'response["contract_version"], "1.26.0"' not in http_test''',
              '''          assert 'response["contract_version"], "1.28.0"' in http_test
                    assert 'response["contract_version"], "1.27.0"' not in http_test
                    assert 'response["contract_version"], "1.26.0"' not in http_test''',
          )
          replace_once(
              workflow,
              'print("CMIS_127_REGRESSION_EXPECTATIONS=PASS")',
              'print("CMIS_128_REGRESSION_EXPECTATIONS=PASS")',
          )
          replace_once(
              workflow,
              '''      - name: Test wallet relationship intelligence v1 contract
                  env:
                    PYTHONPATH: .
                  run: python -m pytest -q tests/test_cmis_wallet_relationship_intelligence.py
          ''',
              '''      - name: Test wallet relationship intelligence v1 contract
                  env:
                    PYTHONPATH: .
                  run: python -m pytest -q tests/test_cmis_wallet_relationship_intelligence.py

                - name: Test wallet relationship CMIS 1.28 capability promotion
                  env:
                    PYTHONPATH: .
                  run: python -m pytest -q tests/test_cmis_wallet_relationship_capability_v128.py
          ''',
          )
          PY

      - name: Run focused public promotion tests
        env:
          PYTHONPATH: .
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest requests python-dotenv websocket-client
          python -m pytest -q tests/test_cmis_wallet_relationship_request.py
          python -m pytest -q tests/test_cmis_wallet_relationship_intelligence.py
          python -m pytest -q tests/test_cmis_wallet_relationship_capability_v128.py
          python -m py_compile liquidity_scout/cmis/capabilities.py liquidity_scout/cmis/__init__.py

      - name: Commit promotion and remove one-shot workflow
        run: |
          rm .github/workflows/apply-wallet-relationship-promotion-631.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add liquidity_scout/cmis/capabilities.py liquidity_scout/cmis/__init__.py tests/test_cmis_capabilities.py tests/test_cmis_http_gateway.py tests/test_cmis_wallet_relationship_capability_v128.py .github/workflows/tests.yml .github/workflows/apply-wallet-relationship-promotion-631.yml
          git commit -m "feat: promote wallet relationship intelligence in CMIS 1.28"
          git push origin HEAD:feat/wallet-relationship-capability-promotion-631
