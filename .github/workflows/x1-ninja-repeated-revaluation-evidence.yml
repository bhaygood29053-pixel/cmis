name: X1.Ninja Repeated Revaluation Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repeated-revaluation:
    name: Live repeated same-fact X1.Ninja revaluation evidence
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'evidence/x1-liquidity-461-five-pool-live'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_NINJA_LIQUIDITY_REVALUATION_SERIES_LIVE: "1"
      X1_NINJA_LIQUIDITY_REVALUATION_SERIES_MAX_WAIT_SECONDS: "1200"
      X1_NINJA_LIQUIDITY_REVALUATION_SERIES_POLL_SECONDS: "20"
      X1_NINJA_LIQUIDITY_REVALUATION_SERIES_MIN_EVENTS: "5"
      X1_NINJA_LIQUIDITY_REVALUATION_SERIES_MIN_POOLS: "5"
      X1_NINJA_LIQUIDITY_REVALUATION_SERIES_MAX_WATCH_POOLS: "150"
      X1_NINJA_LIQUIDITY_REFERENCE_REL_TOL: "0.000001"
      X1_NINJA_LIQUIDITY_TRANSITION_LOOKBACK_SLOTS: "2500"
      X1_NINJA_LIQUIDITY_TRANSITION_RATE_LIMIT_BACKOFF_SECONDS: "65"
      RUN_X1_USDCX_DESTINATION_PARITY_LIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify X1.Ninja key
        shell: bash
        run: |
          if [ -z "${X1_NINJA_API_KEY:-}" ]; then
            echo "X1_NINJA_API_KEY repository secret is unavailable."
            exit 1
          fi

      - name: Run deterministic revaluation-series policy tests
        run: |
          python -m unittest tests.test_x1_ninja_liquidity_revaluation_series -v
          python -m unittest tests.test_x1_ninja_revaluation_watch -v

      - name: Run deterministic USDC.X equivalence tests
        run: |
          python -m unittest tests.test_x1_current_usdcx_usd_equivalence -v
          python -m unittest tests.test_x1_usdcx_destination_parity -v

      - name: Capture five-pool same-fact USD liquidity semantics evidence
        run: |
          python -m unittest tests.test_x1_ninja_liquidity_revaluation_series_live -v

      - name: Safety and promotion boundary
        if: always()
        run: |
          echo "Read-only X1.Ninja/XDEX/X1 RPC/Solana RPC/Pyth/Warp evidence only."
          echo "The bulk catalog watcher may observe up to 150 exact wrapped-XNT candidates, but only X1 RPC-verified pool layouts may contribute evidence."
          echo "The XNT/USDC.X reference pool is excluded from the five semantic sample pools."
          echo "current_usdcx_usd_equivalence_verified may become true only inside the live composed evaluator."
          echo "x1_ninja_liquidity_usd_semantics_verified may become true only after five distinct same-fact pools pass."
          echo "liquidity_freshness_verified=false"
          echo "cmis_promotable=false"
          echo "execution_authorized=false"
