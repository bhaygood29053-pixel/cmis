name: Liquidity Scout Tests

on:
  push:
    branches:
      - main
      - phase6/final-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pytest>=8"

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cmis_dir = Path("liquidity_scout/cmis")
          allowed = {"__init__.py", "capabilities.py", "http.py"}
          remaining = sorted(
              path.name
              for path in cmis_dir.glob("*.py")
              if path.name not in allowed
          )
          assert not remaining, remaining

          from liquidity_scout import cmis
          from liquidity_scout.cmis_private_core import (
              PrivateCoreUnavailable,
              load_runtime_contract,
              private_core_required,
              private_core_status,
          )

          assert tuple(cmis.SUPPORTED_SERVICES) == (
              "asset_lookup",
              "market_report",
              "rank",
              "historical_compare",
              "tokenomics",
              "risk_check",
              "pre_trade_check",
              "trade_verification",
              "verified_asset_activity",
              "instant_x1_scan",
              "verification_evidence",
              "concentration_change_intelligence",
          )
          assert tuple(cmis.SUPPORTED_CHAINS) == ("x1",)
          assert tuple(cmis.KNOWN_CHAINS) == ("x1", "solana")
          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              load_runtime_contract()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMIS public shell did not fail closed without private core")

          try:
              _ = cmis.CMISGateway
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMISGateway resolved without the private core")

          print("PHASE6_CMIS_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("CMIS_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Run public CMIS 1.14 history contract regressions
        run: |
          python -m pytest -q \
            tests/test_cmis_capabilities.py \
            tests/test_cmis_all_available_history.py \
            tests/test_cmis_instant_x1_scan_v2_contract.py
