name: Liquidity Scout Tests

on:
  push:
    branches:
      - main
      - phase6/final-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cmis_dir = Path("liquidity_scout/cmis")
          allowed = {"__init__.py", "capabilities.py", "http.py"}
          remaining = sorted(
              path.name
              for path in cmis_dir.glob("*.py")
              if path.name not in allowed
          )
          assert not remaining, remaining

          from liquidity_scout import cmis
          from liquidity_scout.cmis_private_core import (
              PrivateCoreUnavailable,
              load_runtime_contract,
              private_core_required,
              private_core_status,
          )

          assert tuple(cmis.SUPPORTED_SERVICES) == (
              "asset_lookup",
              "market_report",
              "rank",
              "historical_compare",
              "tokenomics",
              "burn_intelligence",
              "discovery_intelligence",
              "risk_check",
              "pre_trade_check",
              "trade_verification",
              "verified_asset_activity",
              "instant_x1_scan",
              "verification_evidence",
              "concentration_change_intelligence",
          )
          assert tuple(cmis.SUPPORTED_CHAINS) == ("x1",)
          assert tuple(cmis.KNOWN_CHAINS) == ("x1", "solana")
          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              load_runtime_contract()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMIS public shell did not fail closed without private core")

          try:
              _ = cmis.CMISGateway
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMISGateway resolved without the private core")

          print("PHASE6_CMIS_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("CMIS_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Validate CMIS 1.17 Instant X1 Scan v3 freshness contract
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities = Path("liquidity_scout/cmis/capabilities.py").read_text()
          scan_v2 = Path("liquidity_scout/services/cmis_instant_x1_scan.py").read_text()
          scan_v3 = Path("liquidity_scout/services/cmis_instant_x1_scan_v3.py").read_text()
          freshness = Path("liquidity_scout/providers/x1/current_market_freshness.py").read_text()
          policy = Path("liquidity_scout/providers/x1/instant_scan_freshness_policy.json").read_text()
          historical = Path("liquidity_scout/services/cmis_historical.py").read_text()

          assert 'CMIS_CONTRACT_VERSION = "1.17.0"' in capabilities
          assert '"service_contract_version": "instant_x1_scan/v3"' in capabilities
          assert 'CONTRACT_VERSION = "instant_x1_scan/v2"' in scan_v2
          assert 'CONTRACT_VERSION = "instant_x1_scan/v3"' in scan_v3
          assert "build_v2_response" in scan_v3
          assert "x1_current_market_freshness/v1" in freshness
          assert '"max_collection_age_seconds": 60' in policy
          assert '"max_price_fact_age_seconds": 60' in policy
          assert '"max_future_skew_seconds": 5' in policy
          assert '"price_relative_tolerance": 0.005' in policy
          assert "provider_history_imported" in scan_v2
          assert "provider_archive_completeness_not_verified" in scan_v2
          assert '"full_asset_lifetime_verified": (' in scan_v2
          assert '"continuous_coverage_verified": (' in scan_v2
          assert '"status": "not_requested"' in historical
          assert '"reason": "onchain_coverage_not_requested"' in historical
          print("CMIS_117_INSTANT_X1_SCAN_V3_FRESHNESS_CONTRACT=PASS")
          PY

      - name: Test field-scoped freshness evaluator
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_current_market_freshness_v117.py

      - name: Test Instant X1 Scan v3 preservation wrapper
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_instant_x1_scan_v3_contract.py
