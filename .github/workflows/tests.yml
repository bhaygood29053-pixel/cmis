name: Liquidity Scout Tests

on:
  push:
    branches:
      - main
      - phase6/final-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cmis_dir = Path("liquidity_scout/cmis")
          allowed = {"__init__.py", "capabilities.py", "http.py"}
          remaining = sorted(
              path.name
              for path in cmis_dir.glob("*.py")
              if path.name not in allowed
          )
          assert not remaining, remaining

          from liquidity_scout import cmis
          from liquidity_scout.cmis import http
          from liquidity_scout.cmis_private_core import (
              PrivateCoreUnavailable,
              load_runtime_contract,
              private_core_required,
              private_core_status,
          )

          assert tuple(cmis.SUPPORTED_SERVICES) == tuple(http.SUPPORTED_SERVICES)
          assert tuple(cmis.SUPPORTED_CHAINS) == tuple(http.SUPPORTED_CHAINS)
          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              load_runtime_contract()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMIS public shell did not fail closed without private core")

          try:
              http.create_server(host="127.0.0.1", port=0)
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMIS default server constructed without private core")

          print("PHASE6_CMIS_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("CMIS_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
