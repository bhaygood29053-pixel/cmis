name: Liquidity Scout Tests

on:
  push:
    branches:
      - main
      - phase6/final-closure
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  public-shell-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate Phase 6 public boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cmis_dir = Path("liquidity_scout/cmis")
          allowed = {"__init__.py", "capabilities.py", "http.py"}
          remaining = sorted(
              path.name
              for path in cmis_dir.glob("*.py")
              if path.name not in allowed
          )
          assert not remaining, remaining

          from liquidity_scout import cmis
          from liquidity_scout.cmis_private_core import (
              PrivateCoreUnavailable,
              load_runtime_contract,
              private_core_required,
              private_core_status,
          )

          assert tuple(cmis.SUPPORTED_SERVICES) == (
              "asset_lookup",
              "market_report",
              "rank",
              "historical_compare",
              "tokenomics",
              "burn_intelligence",
              "discovery_intelligence",
              "risk_check",
              "pre_trade_check",
              "trade_verification",
              "verified_asset_activity",
              "instant_x1_scan",
              "verification_evidence",
              "concentration_change_intelligence",
              "concentration_warning_intelligence",
          )
          assert tuple(cmis.SUPPORTED_CHAINS) == ("x1",)
          assert tuple(cmis.KNOWN_CHAINS) == ("x1", "solana")
          assert private_core_required() is True
          status = private_core_status()
          assert status["required"] is True
          assert status["available"] is False
          assert status["source"] == "unavailable"

          try:
              load_runtime_contract()
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMIS public shell did not fail closed without private core")

          try:
              _ = cmis.CMISGateway
          except PrivateCoreUnavailable:
              pass
          else:
              raise AssertionError("CMISGateway resolved without the private core")

          print("PHASE6_CMIS_PUBLIC_HISTORY_BOUNDARY=PASS")
          print("CMIS_PRIVATE_CORE_REQUIRED=PASS")
          print("PUBLIC_FALLBACK_USED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Validate CMIS 1.18 capability and Instant X1 Scan v3 freshness contract
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities = Path("liquidity_scout/cmis/capabilities.py").read_text()
          scan_v2 = Path("liquidity_scout/services/cmis_instant_x1_scan.py").read_text()
          scan_v3 = Path("liquidity_scout/services/cmis_instant_x1_scan_v3.py").read_text()
          freshness = Path("liquidity_scout/providers/x1/current_market_freshness.py").read_text()
          policy = Path("liquidity_scout/providers/x1/instant_scan_freshness_policy.json").read_text()
          historical = Path("liquidity_scout/services/cmis_historical.py").read_text()

          assert 'CMIS_CONTRACT_VERSION = "1.18.0"' in capabilities
          assert '"service_contract_version": "instant_x1_scan/v3"' in capabilities
          assert '"concentration_warning_intelligence"' in capabilities
          assert 'CONCENTRATION_WARNING_CONTRACT_VERSION' in capabilities
          assert 'CONCENTRATION_WARNING_DELIVERY_MODE' in capabilities
          assert '"push_delivery_authorized": False' in capabilities
          assert '"watch_clear_are_not_risk_severity"' in capabilities
          assert 'CONTRACT_VERSION = "instant_x1_scan/v2"' in scan_v2
          assert 'CONTRACT_VERSION = "instant_x1_scan/v3"' in scan_v3
          assert "build_v2_response" in scan_v3
          assert "x1_current_market_freshness/v1" in freshness
          assert '"max_collection_age_seconds": 60' in policy
          assert '"max_price_fact_age_seconds": 60' in policy
          assert '"max_future_skew_seconds": 5' in policy
          assert '"price_relative_tolerance": 0.005' in policy
          assert "provider_history_imported" in scan_v2
          assert "provider_archive_completeness_not_verified" in scan_v2
          assert '"full_asset_lifetime_verified": (' in scan_v2
          assert '"continuous_coverage_verified": (' in scan_v2
          assert '"status": "not_requested"' in historical
          assert '"reason": "onchain_coverage_not_requested"' in historical
          print("CMIS_118_CAPABILITY_AND_INSTANT_X1_SCAN_V3=PASS")
          PY

      - name: Test field-scoped freshness evaluator
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_current_market_freshness_v117.py

      - name: Validate CMIS 1.18 regression expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities_test = Path("tests/test_cmis_capabilities.py").read_text()
          http_test = Path("tests/test_cmis_http_gateway.py").read_text()

          assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.18.0")' in capabilities_test
          assert 'self.assertEqual(CMIS_CONTRACT_VERSION, "1.17.0")' not in capabilities_test
          assert 'response["contract_version"], "1.18.0"' in http_test
          assert 'response["contract_version"], "1.17.0"' not in http_test
          print("CMIS_118_REGRESSION_EXPECTATIONS=PASS")
          PY

      - name: Test concentration warning intelligence v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_concentration_warning_intelligence_v118.py

      - name: Test cross-chain asset provenance v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_cross_chain_provenance.py

      - name: Test verified bridge route evidence and Warp qualification v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_bridge_route_evidence.py

      - name: Test Warp machine-contract capture gate v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_contract_capture.py

      - name: Test Warp HAR network-evidence ingestion v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_har_capture.py

      - name: Test Warp wallet-history observation v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_wallet_history_observation.py

      - name: Test Warp wallet-history response semantics v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_wallet_history_semantics.py

      - name: Test accepted Warp config semantics v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_config_semantics.py

      - name: Test bridge flow intelligence v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_bridge_flow_intelligence.py


      - name: Test FortiSwap read-only provider evidence
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_fortiswap_provider.py

      - name: Test Theo advisory-provider connection boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_theo_advisory_provider.py

      - name: Test Warp on-chain account inventory
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_onchain_inventory.py

      - name: Test Warp rare-account capture
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_rare_account_capture.py


      - name: Test Warp on-chain semantic-layout corroboration
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_semantic_layout_discovery.py


      - name: Test Warp transaction-history discovery
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_transaction_history_discovery.py


      - name: Test Warp on-chain transfer history pairing
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_onchain_transfer_history.py

      - name: Test Warp message retention coverage
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_message_retention_coverage.py


      - name: Test Warp message lifecycle retention
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_x1_warp_message_lifecycle_retention.py tests/test_x1_warp_lifecycle_rpc_retry.py
