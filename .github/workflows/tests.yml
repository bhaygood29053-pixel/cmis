name: Liquidity Scout Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: Python unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Liquidity Scout tests
        id: unit_tests
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee unittest-output.txt
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload unittest diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase11-unittest-output
          path: unittest-output.txt
          if-no-files-found: error
