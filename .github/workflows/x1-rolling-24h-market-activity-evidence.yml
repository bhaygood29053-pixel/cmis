name: X1 Rolling 24h Market Activity Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rolling-24h-activity:
    name: Prove exact X1 rolling 24h volume and transactions
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/502-rolling-24h-activity'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_ROLLING_24H_ACTIVITY_LIVE: "1"
      X1_ROLLING_24H_MAX_CANDIDATES: "12"
      X1_ROLLING_24H_MAX_SIGNATURES: "5000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Verify X1.Ninja key
        shell: bash
        run: |
          if [ -z "${X1_NINJA_API_KEY:-}" ]; then
            echo "X1_NINJA_API_KEY repository secret is unavailable."
            exit 1
          fi

      - name: Run deterministic #502 rolling activity tests
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -q tests/test_x1_rolling_24h_market_activity.py
          python -m pytest -q tests/test_x1_current_market_freshness_v2.py

      - name: Prove one exact zero 24h market from X1 RPC
        env:
          PYTHONPATH: .
        run: |
          python -m unittest tests.test_x1_rolling_24h_market_activity_live -v

      - name: Safety and valuation boundary
        if: always()
        run: |
          echo "Read-only X1.Ninja catalog + X1 RPC history/getTransaction evidence only."
          echo "A provider zero never passes without complete exact-pool X1 RPC 24h reconstruction."
          echo "Zero swap volume is exactly USD 0 and requires no exchange-rate assumption."
          echo "Nonzero USD volume remains fail-closed without complete historical quote/USD valuation."
          echo "One provider row is never assumed to equal one chain transaction."
          echo "provider_fact_time_verified=false"
          echo "source_independence_verified=false"
          echo "public_service_promoted=false"
          echo "scout_reliance_promoted=false"
          echo "execution_authorized=false"
