name: XONE XNT Allocation Source Provenance

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_allocation_source_provenance.py'
      - 'scripts/discover_xone_xnt_allocation_source_provenance.py'
      - 'docs/XONE_XNT_ALLOCATION_SOURCE_PROVENANCE_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-allocation-source-provenance.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_allocation_source_provenance.py'
      - 'scripts/discover_xone_xnt_allocation_source_provenance.py'
      - 'docs/XONE_XNT_ALLOCATION_SOURCE_PROVENANCE_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-allocation-source-provenance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test allocation source provenance
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_allocation_source_provenance.py
      - name: Re-run X1 allocation-record boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_x1_allocation_record_discovery.py
      - name: Re-run snapshot provenance boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_snapshot_provenance_expansion.py
      - name: Re-run archived asset-graph boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_snapshot_archived_asset_graph.py

  live-provenance:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Discover XONE XNT allocation source provenance
        env:
          PYTHONPATH: .
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/discover_xone_xnt_allocation_source_provenance.py             --max-files-per-repo 30             --max-candidates 100             | tee evidence/xone-xnt-allocation-source-provenance.json

          python - <<'PY'
          import json

          path = "evidence/xone-xnt-allocation-source-provenance.json"
          data = json.load(open(path))

          assert data["status"] == "PASS"
          assert (
              data["contract_version"]
              == "xone_xnt_allocation_source_provenance/v1"
          )
          assert data["source_gate_passed"] is True
          assert data["sources"]["repository_available_count"] == 3
          assert data["sources"]["repository_files_available_count"] >= 5
          assert data["sources"]["release_query_available_count"] == 3
          assert data["sources"]["official_available_count"] >= 1

          provenance = data["allocation_source_provenance"]
          assert (
              provenance[
                  "allocation_source_provenance_discovery_verified"
              ]
              is True
          )
          assert provenance["allocation_source_provenance_verified"] is False
          assert provenance["authoritative_allocation_source_verified"] is False
          assert (
              provenance[
                  "private_or_unpublished_allocation_source_absence_proven"
              ]
              is False
          )

          for candidate in provenance["candidates"]:
              assert candidate["allocation_source_candidate_discovered"] is True
              assert candidate["allocation_source_provenance_verified"] is False
              assert candidate["authoritative_allocation_source_verified"] is False
              assert candidate["snapshot_eligibility_verified"] is False
              assert (
                  candidate["snapshot_xnt_allocation_binding_verified"]
                  is False
              )
              assert candidate["xnt_issuance_verified"] is False
              assert candidate["execution_authorized"] is False
              if candidate["architecture_analogue"] is True:
                  assert candidate["xone_source_binding_verified"] is False
                  assert (
                      candidate[
                          "qualifying_xone_allocation_source_candidate"
                      ]
                      is False
                  )

          assert data["official_xone_snapshot_verified"] is False
          assert data["official_registry_artifact_verified"] is False
          assert data["xone_snapshot_eligibility_verified"] is False
          assert data["xone_snapshot_xnt_allocation_binding_verified"] is False
          assert data["allocation_semantics_verified"] is False
          assert data["claim_state_verified"] is False
          assert data["vesting_or_unlock_state_verified"] is False
          assert data["xnt_issuance_verified"] is False
          assert data["xnt_vesting_or_unlock_verified"] is False
          assert data["october_6_unlock_applies_to_xone_verified"] is False
          assert data["xone_xnt_conversion_verified"] is False
          assert data["cross_chain_correlation_verified"] is False
          assert data["public_service_promoted"] is False
          assert data["scout_reliance_promoted"] is False
          assert data["execution_authorized"] is False

          print(f"CANDIDATES={provenance['candidate_count']}")
          print(
              "QUALIFYING_XONE_CANDIDATES="
              f"{provenance['qualifying_xone_candidate_count']}"
          )
          print(
              "EXACT_XONE_SOURCE_BOUND_CANDIDATES="
              f"{provenance['exact_xone_source_bound_candidate_count']}"
          )
          print(
              "ARCHITECTURE_ANALOGUES="
              f"{provenance['architecture_analogue_candidate_count']}"
          )
          print("SNAPSHOT_XNT_ALLOCATION_BINDING_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xone-xnt-allocation-source-provenance-evidence
          path: evidence/xone-xnt-allocation-source-provenance.json
          if-no-files-found: error
