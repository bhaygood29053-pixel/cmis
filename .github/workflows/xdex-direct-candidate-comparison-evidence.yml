name: XDEX Direct Candidate Comparison Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  xdex-direct-candidate-comparison-evidence:
    name: Read-only direct candidate quote comparison
    if: github.head_ref == 'agent/xdex-direct-candidate-live-comparison'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_XDEX_DIRECT_CANDIDATE_COMPARISON_LIVE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compare every verified direct candidate
        run: |
          python -m unittest tests.test_xdex_direct_candidate_comparison_live -v

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1 RPC + XDEX quote GET only."
          echo "Every candidate must pass hardened exact-route resolver validation."
          echo "No /swap/prepare, transaction construction, signing, broadcasting, custody, simulation, execution, or value movement."
