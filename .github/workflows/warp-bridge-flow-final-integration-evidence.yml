name: Warp Bridge Flow Final Integration Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warp-bridge-flow-final-unit:
    name: Test final Warp bridge-flow integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run deterministic final-integration tests
        run: python -m pytest -q tests/test_x1_warp_bridge_flow_integration.py

  warp-bridge-flow-final-live:
    name: Verify live final Warp Bridge Flow Intelligence
    needs: warp-bridge-flow-final-unit
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/issue454-warp-bridge-flow-final-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Bind accepted route, lifecycle, settled events, and supply
        run: |
          python - <<'PY'
          import json
          import time

          from liquidity_scout.providers.x1.bridge_source_provenance import (
              BridgeSourceProof,
              evaluate_bridge_source_provenance,
          )
          from liquidity_scout.providers.x1.warp_bridge_flow_integration import (
              build_warp_bridge_flow_integration,
          )
          from liquidity_scout.providers.x1.warp_bridged_supply_evidence import (
              WSOL_ROUTE_ID,
              WSOL_SOURCE_MINT,
              WSOL_X_DESTINATION_MINT,
              build_warp_bridged_supply_evidence,
              capture_destination_mint_observation,
              capture_source_vault_observation,
          )
          from liquidity_scout.providers.x1.warp_config_semantics import (
              WARP_CONFIG_SOURCE_URL,
              build_warp_config_route_observation,
          )
          from liquidity_scout.providers.x1.warp_lifecycle_rpc_retry import (
              resilient_get_transaction_post,
          )
          from liquidity_scout.providers.x1.warp_message_lifecycle_retention import (
              capture_warp_message_lifecycle_retention,
          )
          from liquidity_scout.providers.x1.warp_message_retention_coverage import (
              evaluate_warp_message_counter_closure,
              fetch_classified_warp_config_account,
              fetch_official_warp_config,
          )
          from liquidity_scout.providers.x1.warp_onchain_transfer_history import (
              capture_warp_message_state,
              normalize_warp_route_events,
          )
          from liquidity_scout.services.cmis_bridge_route_evidence import (
              qualify_warp_bridge_route,
          )
          from liquidity_scout.services.cmis_cross_chain_provenance import (
              build_cross_chain_asset_provenance,
          )

          def endpoint(chain, mint):
              return {
                  "chain": chain,
                  "asset_id": mint,
                  "asset_id_kind": "mint",
              }

          official = fetch_official_warp_config()
          observation = build_warp_config_route_observation(
              config_response=official,
              route_id=WSOL_ROUTE_ID,
              source=endpoint("solana", WSOL_SOURCE_MINT),
              destination=endpoint("x1", WSOL_X_DESTINATION_MINT),
          )

          provenance = build_cross_chain_asset_provenance(
              canonical_asset_id="sol",
              origin=endpoint("solana", WSOL_SOURCE_MINT),
              current=endpoint("x1", WSOL_X_DESTINATION_MINT),
              hops=[
                  {
                      "source": endpoint("solana", WSOL_SOURCE_MINT),
                      "destination": endpoint("x1", WSOL_X_DESTINATION_MINT),
                      "bridge": "Warp Bridge",
                      "representation_type": "bridge_representation",
                      "custody_model": "unknown",
                      "bridge_route_id": WSOL_ROUTE_ID,
                  }
              ],
          )
          source_provenance = evaluate_bridge_source_provenance(
              url=WARP_CONFIG_SOURCE_URL,
              proofs=[
                  BridgeSourceProof(
                      proof_type="official_app_network_observation",
                      reference="accepted exact Warp config endpoint",
                      exact_url=WARP_CONFIG_SOURCE_URL,
                  )
              ],
          )
          qualification = qualify_warp_bridge_route(
              provenance=provenance,
              hop_index=0,
              source_provenance=source_provenance,
              observation=observation,
              evaluated_at=observation["source_observed_at"] + 1,
          )
          assert qualification["warp_qualified"] is True

          message_state = capture_warp_message_state()
          normalized = normalize_warp_route_events(
              route_observation=observation,
              message_state=message_state,
          )
          assert normalized["pairing_semantics_verified"] is True
          assert normalized["settled_event_semantics_verified"] is True
          assert normalized["flow_event_normalization_authorized"] is True

          classified = {
              "solana": fetch_classified_warp_config_account(chain="solana"),
              "x1": fetch_classified_warp_config_account(chain="x1"),
          }
          counter_closure = evaluate_warp_message_counter_closure(
              config_response=official,
              classified_configs=classified,
              message_state=message_state,
          )
          assert counter_closure["counter_account_closure_verified"] is True
          assert counter_closure["current_message_universe_count_closed"] is True

          lifecycle = capture_warp_message_lifecycle_retention(
              counter_closure=counter_closure,
              message_state=message_state,
              as_of=int(time.time()),
              post=resilient_get_transaction_post,
          )
          assert lifecycle["historical_retention_complete_verified"] is True
          assert lifecycle["requested_window_coverage_verified"] is True
          assert lifecycle["coverage_complete_verified"] is True
          assert lifecycle["missing_history_zero_authorized"] is True

          source_vault = capture_source_vault_observation(
              source_mint=WSOL_SOURCE_MINT,
          )
          destination_mint = capture_destination_mint_observation(
              destination_mint=WSOL_X_DESTINATION_MINT,
          )
          supply = build_warp_bridged_supply_evidence(
              route_observation=observation,
              source_vault=source_vault,
              destination_mint=destination_mint,
              evaluated_at=time.time(),
          )
          assert supply["bridged_supply_verified"] is True

          result = build_warp_bridge_flow_integration(
              route_qualification=qualification,
              normalized_events=normalized,
              lifecycle_retention=lifecycle,
              bridged_supply=supply,
              source_independence_verified=False,
          )

          assert result["integration_verified"] is True
          assert result["route_qualification_verified"] is True
          assert result["canonical_event_pairing_verified"] is True
          assert result["historical_retention_complete_verified"] is True
          assert result["requested_window_coverage_verified"] is True
          assert result["coverage_complete_verified"] is True
          assert result["missing_history_zero_authorized"] is True
          assert result["bridged_supply_verified"] is True
          assert result["all_current_and_prior_windows_complete"] is True
          assert result["all_current_and_prior_window_values_non_null"] is True
          assert result["source_independence_verified"] is False
          assert result["provider_tvl_label_promoted"] is False
          assert result["public_service_promoted"] is False
          assert result["scout_reliance_promoted"] is False
          assert result["execution_authorized"] is False

          evidence = {
              "contract": result["contract"],
              "route_id": result["route_id"],
              "coverage_start": result["coverage_start"],
              "coverage_end": result["coverage_end"],
              "normalized_unresolved_counts": result["normalized_unresolved_counts"],
              "historical_retention_complete_verified": result[
                  "historical_retention_complete_verified"
              ],
              "requested_window_coverage_verified": result[
                  "requested_window_coverage_verified"
              ],
              "missing_history_zero_authorized": result[
                  "missing_history_zero_authorized"
              ],
              "bridged_supply": result["flow"]["bridged_supply"],
              "windows": result["flow"]["windows"],
              "source_independence_verified": result[
                  "source_independence_verified"
              ],
              "integration_verified": result["integration_verified"],
              "public_service_promoted": result["public_service_promoted"],
              "scout_reliance_promoted": result["scout_reliance_promoted"],
              "execution_authorized": result["execution_authorized"],
              "evidence_sha256": result["evidence_sha256"],
          }
          print("WARP_BRIDGE_FLOW_FINAL_INTEGRATION_EVIDENCE")
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only exact Warp route, finalized lifecycle, settled-event, and supply evidence only."
          echo "Provider labels are not substituted for exact on-chain evidence."
          echo "Source independence remains explicit and unproven unless separately established."
          echo "No transaction construction, signing, broadcast, custody, mint, burn, or value movement."
          echo "EXECUTION_AUTHORIZED=FALSE"
