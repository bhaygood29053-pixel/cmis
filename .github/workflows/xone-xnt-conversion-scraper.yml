name: XONE XNT Conversion Scraper

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_conversion_scraper.py'
      - 'scripts/scrape_xone_xnt_conversion.py'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-conversion-scraper.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_xnt_conversion_scraper.py'
      - 'scripts/scrape_xone_xnt_conversion.py'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-xnt-conversion-scraper.yml'

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest requests
      - name: Test dedicated XONE/XNT scraper
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py
      - name: Verify authority boundary
        env:
          PYTHONPATH: .
        run: |
          python - <<'PY'
          from liquidity_scout.services.cmis_xone_xnt_conversion_intelligence import (
              CMISXoneXntConversionIntelligenceService,
          )

          result = CMISXoneXntConversionIntelligenceService().sources()
          assert result["web_claim_verified"] is False
          assert result["ethereum_event_verified"] is False
          assert result["x1_event_verified"] is False
          assert result["cross_chain_correlation_verified"] is False
          assert result["cmis_verified"] is False
          assert result["public_service_promoted"] is False
          assert result["scout_reliance_promoted"] is False
          assert result["cmis_promotable"] is False
          assert result["execution_authorized"] is False
          print("XONE_XNT_CONVERSION_SCRAPER_BOUNDARY=PASS")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
