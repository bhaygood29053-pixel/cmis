name: X1.Ninja Live Price-Reserve Update Event Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-update-event:
    name: Capture Ninja price/reserve update event
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/issue347-ninja-live-update-event'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_NINJA_LIVE_UPDATE_EVENT: "1"
      X1_NINJA_UPDATE_MAX_SNAPSHOTS: "36"
      X1_NINJA_UPDATE_POLL_SECONDS: "10"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify X1.Ninja key
        run: |
          test -n "${X1_NINJA_API_KEY:-}"
      - name: Run deterministic update-event tests
        run: |
          python -m unittest tests.test_x1_ninja_live_update_event -v
      - name: Run bounded live update-event evidence
        run: |
          python -m unittest tests.test_x1_ninja_live_update_event_live -v
      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only update-event evidence only."
          echo "No timestamp-unit, fact-time, priceNative, priceUsd, liquidity, TVL, freshness or source-independence promotion."
          echo "No Scout/public-service/risk/execution authority."
