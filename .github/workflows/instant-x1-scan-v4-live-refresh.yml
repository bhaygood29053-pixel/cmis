name: X1 Provider Snapshot for Runtime Auto-Refresh #513

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-provider-snapshot:
    name: Capture non-secret X1.Ninja snapshot for protected #513 gate
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/513-live-runtime-freshness-proof'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}

    steps:
      - name: Check out public CMIS shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Capture bounded provider snapshot
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import time

          from liquidity_scout.market.resolver import find_matches_for_term, pool_address
          from liquidity_scout.providers.x1.liquidity_freshness import REFERENCE_POOL_ADDRESS
          from liquidity_scout.providers.x1.market import fetch_all_pools
          from liquidity_scout.providers.x1.xdex_price_history_import import WRAPPED_XNT_MINT

          def text(value):
              value = str(value or "").strip()
              return value or None

          def number(value):
              if value is None or isinstance(value, bool):
                  return None
              try:
                  return float(value)
              except (TypeError, ValueError):
                  return None

          def token_mint(token):
              if not isinstance(token, dict):
                  return None
              return text(token.get("mint") or token.get("address"))

          pools, xnt_price = fetch_all_pools(sleep_seconds=0)
          candidates = []
          seen = set()
          for pool in pools:
              if not isinstance(pool, dict):
                  continue
              address = text(pool_address(pool))
              if not address or address in seen:
                  continue
              volume = number(pool.get("volume24h"))
              txs = number(
                  pool.get("txns24h")
                  if pool.get("txns24h") is not None
                  else pool.get("transactions24h")
              )
              if volume != 0.0 or txs != 0.0:
                  continue
              base = token_mint(pool.get("baseToken"))
              quote = token_mint(pool.get("quoteToken"))
              if base == WRAPPED_XNT_MINT and quote and quote != WRAPPED_XNT_MINT:
                  asset_mint = quote
              elif quote == WRAPPED_XNT_MINT and base and base != WRAPPED_XNT_MINT:
                  asset_mint = base
              else:
                  continue
              matches = [
                  match
                  for match in find_matches_for_term(asset_mint, pools)
                  if len(match) >= 4 and match[3] >= 90
              ]
              addresses = []
              match_seen = set()
              for match in matches:
                  selected = text(pool_address(match[0]))
                  if selected and selected not in match_seen:
                      match_seen.add(selected)
                      addresses.append(selected)
              if addresses != [address]:
                  continue
              seen.add(address)
              candidates.append(
                  {
                      "asset_mint": asset_mint,
                      "pool_address": address,
                      "liquidity": number(pool.get("liquidity")) or 0.0,
                      "provider_volume24h": volume,
                      "provider_transactions24h": int(txs),
                  }
              )

          candidates.sort(
              key=lambda row: (
                  -row["liquidity"],
                  row["pool_address"],
                  row["asset_mint"],
              )
          )
          if not candidates:
              raise SystemExit("no exact zero-activity single-pool wrapped-XNT candidate")

          selected = candidates[0]
          required = {selected["pool_address"], REFERENCE_POOL_ADDRESS}
          retained = [
              dict(row)
              for row in pools
              if text(pool_address(row)) in required
          ]
          retained_addresses = {text(pool_address(row)) for row in retained}
          if retained_addresses != required:
              raise SystemExit(
                  f"required provider rows unavailable: expected={sorted(required)} "
                  f"actual={sorted(retained_addresses)}"
              )

          evidence = {
              "schema": "instant_x1_scan_v4_provider_snapshot_513/v1",
              "captured_at": time.time(),
              "selection_policy": (
                  "exact_single_pool_wrapped_xnt_zero_activity;"
                  "liquidity_desc_then_pool_address_then_asset_mint"
              ),
              "selected": selected,
              "reference_pool_address": REFERENCE_POOL_ADDRESS,
              "xnt_price_usd": xnt_price,
              "pools": retained,
              "provider_secret_included": False,
              "execution_authorized": False,
          }
          rendered = json.dumps(evidence, sort_keys=True, default=str)
          with open("artifacts/x1-provider-snapshot-513.json", "w", encoding="utf-8") as handle:
              handle.write(rendered + "\n")
          print("X1 #513 NON-SECRET PROVIDER SNAPSHOT")
          print(rendered)
          PY

      - name: Upload provider snapshot
        uses: actions/upload-artifact@v4
        with:
          name: x1-provider-snapshot-513
          path: artifacts/x1-provider-snapshot-513.json
          if-no-files-found: error

      - name: Safety boundary
        if: always()
        run: |
          echo "Snapshot contains provider market data only; no API key or private core source."
          echo "No transaction construction, signing, broadcast, custody, mint, burn, swap, or value movement."
          echo "EXECUTION_AUTHORIZED=FALSE"
