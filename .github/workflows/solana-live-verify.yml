name: Solana Live Verification

on:
  workflow_dispatch:
    inputs:
      run_rpc_contract:
        description: Run read-only canonical Solana token RPC contract verification
        required: true
        default: true
        type: boolean
      mint:
        description: Solana mint to probe (default is Circle mainnet USDC)
        required: true
        default: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        type: string
  pull_request:
    paths:
      - "liquidity_scout/providers/solana/**"
      - "liquidity_scout/cmis/solana_*.py"
      - "tests/test_solana_rpc_live_contract.py"
      - ".github/workflows/solana-live-verify.yml"

permissions:
  contents: read

jobs:
  solana-live-verify:
    name: Read-only Solana RPC verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional repository secret for a production RPC provider. When absent,
      # the required gate uses Solana's public mainnet RPC. Never print this value.
      SOLANA_RPC_URL_SECRET: ${{ secrets.SOLANA_RPC_URL }}
      # Pull-request acceptance always uses the fixed known USDC mint. Manual
      # dispatch may override it with another exact mint.
      SOLANA_LIVE_TEST_MINT: ${{ github.event_name == 'workflow_dispatch' && inputs.mint || 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out protected CMIS baseline
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/cmis
          ref: 45551d112e0779343c0d0e50d0d2631efc88f76c
          path: cmis-protected-baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          pip install -r requirements.txt

      - name: Build private CMIS runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase5-build phase5-dist phase5-runtime
          mkdir -p phase5-build/liquidity_scout/cmis phase5-build/cmis_core phase5-dist phase5-runtime/site

          cp cmis-protected-baseline/liquidity_scout/cmis/*.py phase5-build/liquidity_scout/cmis/
          rm -f \
            phase5-build/liquidity_scout/cmis/__init__.py \
            phase5-build/liquidity_scout/cmis/capabilities.py \
            phase5-build/liquidity_scout/cmis/http.py

          cat > phase5-build/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "cmis-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = []

          [tool.setuptools.packages.find]
          where = ["."]
          include = ["cmis_core*", "liquidity_scout.cmis*"]
          namespaces = true
          EOF

          cat > phase5-build/cmis_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/cmis"
          PUBLIC_SHELL_BASELINE = "bd9aaa786a9188d3edbfa35692b6754fd9b8b769"
          EOF

          cat > phase5-build/cmis_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "cmis-private-core/v1"

          def runtime_gateway_class():
              from liquidity_scout.cmis.runtime_gateway import RuntimeCMISGateway
              return RuntimeCMISGateway

          def runtime_contract():
              from liquidity_scout.cmis.gateway import KNOWN_CHAINS, SUPPORTED_CHAINS
              from liquidity_scout.cmis.runtime_gateway import SUPPORTED_SERVICES, RuntimeCMISGateway
              return {
                  "contract": CUTOVER_CONTRACT,
                  "gateway_class": RuntimeCMISGateway,
                  "supported_services": tuple(SUPPORTED_SERVICES),
                  "supported_chains": tuple(SUPPORTED_CHAINS),
                  "known_chains": tuple(KNOWN_CHAINS),
              }
          EOF

          python -m build --wheel --outdir phase5-dist phase5-build
          python -m pip install --no-deps --target phase5-runtime/site phase5-dist/*.whl
          rsync -a --ignore-existing liquidity_scout/ phase5-runtime/site/liquidity_scout/
          python -m compileall -q phase5-runtime/site

      - name: Validate probe mint
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOLANA_LIVE_TEST_MINT:-}" ]; then
            echo "A non-empty Solana mint is required."
            exit 1
          fi
          echo "Read-only token RPC contract probe configured."

      - name: Run canonical Solana runtime acceptance
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        env:
          RUN_SOLANA_LIVE_TESTS: "1"
        run: |
          set -euo pipefail
          export SOLANA_RPC_URL="${SOLANA_RPC_URL_SECRET:-https://api.mainnet-beta.solana.com}"
          if [ -n "${SOLANA_RPC_URL_SECRET:-}" ]; then
            export RUN_SOLANA_LARGEST_ACCOUNTS_LIVE_TESTS=1
          fi
          cd phase5-runtime
          PYTHONPATH="$GITHUB_WORKSPACE/phase5-runtime/site:$GITHUB_WORKSPACE" \
            python -m unittest tests.test_solana_rpc_live_contract -v

      - name: Safety boundary
        run: |
          echo "Required live methods include getTokenSupply, getAccountInfo(jsonParsed), and read-only getAccountInfo(base64) for the exact Pyth USDC/USD sponsored feed account."
          echo "Production runtime asset_lookup/tokenomics and the read-only Pyth account contract are exercised against accepted fixtures."
          echo "Jupiter/Pyth same-time policy is deterministic and does not require CI to manufacture a live SAME_TIME sample or a Jupiter credential."
          echo "getTokenLargestAccounts concentration evidence is additionally exercised when a dedicated RPC secret is configured."
          echo "No wallet key, transaction preparation, simulation, signing, broadcasting, swap route, Pyth update submission, or value movement is used."
