name: Solana Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-provider-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate public Solana provider fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from liquidity_scout.providers.solana.live_fixture import SOLANA_TOKEN_2022_LIVE_FIXTURE
          fixture = SOLANA_TOKEN_2022_LIVE_FIXTURE
          assert fixture.execution_authorized is False
          assert fixture.mint
          print("SOLANA_PUBLIC_PROVIDER_FIXTURE=PASS")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Explain private runtime boundary
        run: |
          echo "Full Scout -> CMIS Solana live verification runs only where cmis-private-core and deployment RPC credentials are securely configured."
          echo "The public repository no longer reconstructs private CMIS implementation from historical public commits."
