name: Solana Live Verification

on:
  workflow_dispatch:
    inputs:
      run_rpc_contract:
        description: Run read-only canonical Solana token RPC contract verification
        required: true
        default: true
        type: boolean
      mint:
        description: Solana mint to probe (default is Circle mainnet USDC)
        required: true
        default: EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v
        type: string
  pull_request:
    paths:
      - "liquidity_scout/providers/solana/**"
      - "liquidity_scout/cmis/solana_*.py"
      - "tests/test_solana_rpc_live_contract.py"
      - ".github/workflows/solana-live-verify.yml"

permissions:
  contents: read

jobs:
  solana-live-verify:
    name: Read-only Solana RPC verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional repository secret for a production RPC provider. When absent,
      # the required gate uses Solana's public mainnet RPC. Never print this value.
      SOLANA_RPC_URL_SECRET: ${{ secrets.SOLANA_RPC_URL }}
      # Pull-request acceptance always uses the fixed known USDC mint. Manual
      # dispatch may override it with another exact mint.
      SOLANA_LIVE_TEST_MINT: ${{ github.event_name == 'workflow_dispatch' && inputs.mint || 'EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate probe mint
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SOLANA_LIVE_TEST_MINT:-}" ]; then
            echo "A non-empty Solana mint is required."
            exit 1
          fi
          echo "Read-only token RPC contract probe configured."

      - name: Run canonical Solana runtime acceptance
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        env:
          RUN_SOLANA_LIVE_TESTS: "1"
        run: |
          set -euo pipefail
          export SOLANA_RPC_URL="${SOLANA_RPC_URL_SECRET:-https://api.mainnet-beta.solana.com}"
          if [ -n "${SOLANA_RPC_URL_SECRET:-}" ]; then
            export RUN_SOLANA_LARGEST_ACCOUNTS_LIVE_TESTS=1
          fi
          python -m unittest tests.test_solana_rpc_live_contract -v

      - name: Safety boundary
        run: |
          echo "Required live methods include getTokenSupply, getAccountInfo(jsonParsed), and read-only getAccountInfo(base64) for the exact Pyth USDC/USD sponsored feed account."
          echo "Production runtime asset_lookup/tokenomics and the read-only Pyth account contract are exercised against accepted fixtures."
          echo "Jupiter/Pyth same-time policy is deterministic and does not require CI to manufacture a live SAME_TIME sample or a Jupiter credential."
          echo "getTokenLargestAccounts concentration evidence is additionally exercised when a dedicated RPC secret is configured."
          echo "No wallet key, transaction preparation, simulation, signing, broadcasting, swap route, Pyth update submission, or value movement is used."
