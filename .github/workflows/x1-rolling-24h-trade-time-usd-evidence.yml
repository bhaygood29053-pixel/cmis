name: X1 Rolling 24h Trade-Time USD #504 Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue504-unit:
    name: Test #504 fact-time USD valuation contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run deterministic #504 tests
        run: |
          python -m pytest -q \
            tests/test_x1_warp_message_interval_retention.py \
            tests/test_x1_trade_time_usd_valuation.py \
            tests/test_x1_rolling_24h_market_activity.py

  issue504-live:
    name: Prove live nonzero X1 24h USD volume at trade fact time
    needs: issue504-unit
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feature/504-trade-time-usd-volume'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTHONPATH: .
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      RUN_X1_ROLLING_24H_USD_VOLUME_LIVE: "1"
      X1_ROLLING_24H_MAX_SIGNATURES: "5000"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Prove exact nonzero 24h USD volume at transaction fact time
        run: |
          python -m pytest -q -s tests/test_x1_trade_time_usd_valuation_live.py

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1 RPC, Warp, Solana RPC, X1.Ninja comparison, and public Kraken market-data evidence only."
          echo "X1.Ninja USD price/volume is never used as the valuation price source."
          echo "No current-price substitution and no stable-name-equals-one-dollar assumption."
          echo "The short retention interval is scoped only to #504 fact-time valuation; it does not replace the accepted 60-day #441 gate."
          echo "Source independence remains separately unpromoted."
          echo "No transaction construction, signing, broadcast, custody, mint, burn, or value movement."
          echo "EXECUTION_AUTHORIZED=FALSE"
