name: Reconcile Issue Hygiene 352 354
on:
  push:
    branches:
      - docs/reconcile-ninja-linkage-352-354
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-ninja-linkage-352-354
      - name: Reconcile roadmap line
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CMIS_PRODUCT_ROADMAP.md')
          s = p.read_text()
          old = '**Issue hygiene: ACTIVE / #385, #333, #335, #349, #350 RESOLVED.**'
          new = '**Issue hygiene: ACTIVE / #385, #333, #335, #349, #350, #352, #354 RESOLVED.**'
          if old not in s:
              raise SystemExit('expected roadmap hygiene marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm .github/workflows/reconcile-issue-hygiene-352-354.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CMIS_PRODUCT_ROADMAP.md .github/workflows/reconcile-issue-hygiene-352-354.yml
          git commit -m 'docs: reconcile completed X1.Ninja linkage investigations 352 354'
          git push origin HEAD:docs/reconcile-ninja-linkage-352-354
