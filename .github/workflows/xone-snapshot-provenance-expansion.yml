name: XONE Snapshot Provenance Expansion

on:
  pull_request:
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/providers/ethereum/xone_snapshot_registry.py'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_snapshot_provenance_expansion.py'
      - 'scripts/discover_xone_snapshot_provenance.py'
      - 'docs/XONE_SNAPSHOT_PROVENANCE_EXPANSION_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-snapshot-provenance-expansion.yml'
  push:
    branches: [main]
    paths:
      - 'liquidity_scout/providers/xone_xnt/**'
      - 'liquidity_scout/providers/ethereum/xone_snapshot_registry.py'
      - 'liquidity_scout/services/cmis_xone_xnt_conversion_intelligence.py'
      - 'tests/test_xone_snapshot_provenance_expansion.py'
      - 'scripts/discover_xone_snapshot_provenance.py'
      - 'docs/XONE_SNAPSHOT_PROVENANCE_EXPANSION_V1.md'
      - 'docs/XONE_XNT_CONVERSION_INTELLIGENCE_V1.md'
      - '.github/workflows/xone-snapshot-provenance-expansion.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest
      - name: Test XONE snapshot provenance expansion
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_snapshot_provenance_expansion.py
      - name: Re-run Ethereum XONE snapshot registry boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_ethereum_xone_snapshot_registry.py
      - name: Re-run dedicated XONE/XNT scraper boundary
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_xone_xnt_conversion_scraper.py

  live-provenance:
    needs: deterministic
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Expand bounded XONE snapshot provenance
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p evidence
          python scripts/discover_xone_snapshot_provenance.py             --max-commits 100             --max-paths 100             --max-files 20             --x1report-max-urls 50             --log-chunk-blocks 50000             --balance-sample-size 25             | tee evidence/xone-snapshot-provenance-expansion.json

          python - <<'PY'
          import json

          path = "evidence/xone-snapshot-provenance-expansion.json"
          data = json.load(open(path))

          assert data["status"] == "PASS"
          assert data["contract_version"] == "xone_snapshot_provenance_expansion/v1"
          assert data["source_gate_passed"] is True
          assert data["faircrypto_repository_available_count"] == 2
          assert data["x1_labs_repository_available"] is True
          assert data["official_x1_available_count"] >= 2
          assert data["x1report"]["status"] == "AVAILABLE"
          assert data["x1report"]["pages_available"] > 0
          assert data["indexed_history_available_count"] >= 1

          provenance = data["provenance"]
          assert provenance["official_xone_snapshot_verified"] is False
          assert provenance["official_registry_artifact_verified"] is False
          assert provenance["xone_snapshot_eligibility_verified"] is False
          assert provenance["xone_snapshot_xnt_allocation_binding_verified"] is False
          assert provenance["private_or_unpublished_snapshot_absence_proven"] is False

          blocks = provenance["authoritative_exact_snapshot_block_candidates"]
          if blocks:
              assert len(blocks) == 1
              assert provenance["authoritative_snapshot_block_conflict"] is False
              assert data[
                  "reconstruction_required_by_authoritative_exact_block"
              ] is True
              assert data["reconstruction_gate_passed"] is True
              assert data["reconstruction"]["attempted"] is True
              assert data["reconstruction"]["corroboration"][
                  "multi_rpc_corroborated"
              ] is True
              assert data["official_xone_snapshot_verified"] is True
          else:
              assert provenance[
                  "zero_authoritative_blocks_are_scoped_provenance_evidence_only"
              ] is True
              assert data[
                  "zero_authoritative_blocks_are_scoped_public_provenance_only"
              ] is True
              assert data[
                  "reconstruction_required_by_authoritative_exact_block"
              ] is False
              assert data["reconstruction_gate_passed"] is True
              assert data["official_xone_snapshot_verified"] is False

          assert data["official_registry_artifact_verified"] is False
          assert data["xone_snapshot_eligibility_verified"] is False
          assert data["xone_snapshot_xnt_allocation_binding_verified"] is False
          assert data["xnt_issuance_verified"] is False
          assert data["xnt_vesting_or_unlock_verified"] is False
          assert data["october_6_unlock_applies_to_xone_verified"] is False
          assert data["xone_xnt_conversion_verified"] is False
          assert data["cross_chain_correlation_verified"] is False
          assert data["private_or_unpublished_snapshot_absence_proven"] is False
          assert data["public_service_promoted"] is False
          assert data["scout_reliance_promoted"] is False
          assert data["execution_authorized"] is False

          print(f"PROVENANCE_CANDIDATES={provenance['candidate_count']}")
          print(
              "DIRECT_PRIMARY_SOURCE_CANDIDATES="
              f"{provenance['direct_primary_source_candidate_count']}"
          )
          print(
              "SNAPSHOT_ARTIFACT_CANDIDATES="
              f"{provenance['snapshot_artifact_candidate_count']}"
          )
          print(
              "INDEXED_MIRROR_CANDIDATES="
              f"{provenance['indexed_mirror_candidate_count']}"
          )
          print(
              "AUTHORITATIVE_EXACT_SNAPSHOT_BLOCKS="
              f"{len(blocks)}"
          )
          print(
              "OFFICIAL_XONE_SNAPSHOT_VERIFIED="
              f"{str(data['official_xone_snapshot_verified']).upper()}"
          )
          print("XONE_SNAPSHOT_XNT_ALLOCATION_BINDING_VERIFIED=FALSE")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: xone-snapshot-provenance-expansion-evidence
          path: evidence/xone-snapshot-provenance-expansion.json
          if-no-files-found: error
