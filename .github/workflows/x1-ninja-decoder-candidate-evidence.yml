name: X1.Ninja Decoder Candidate Evidence

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  decoder-candidate:
    if: github.head_ref == 'agent/issue347-ninja-live-update-event'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      RUN_X1_NINJA_DECODER_CANDIDATE_LIVE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: |
          python -m unittest tests.test_x1_ninja_decoder_candidate_live -v
