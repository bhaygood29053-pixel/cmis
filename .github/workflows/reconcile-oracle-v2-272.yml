name: Reconcile Oracle V2 272

on:
  push:
    branches:
      - docs/reconcile-oracle-v2-272

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/reconcile-oracle-v2-272
          fetch-depth: 0
      - name: Reconcile authoritative roadmap
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/CMIS_PRODUCT_ROADMAP.md')
          text = path.read_text()
          lines = text.splitlines()
          prefix = '7. **Issue hygiene:'
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one issue-hygiene line, found {len(matches)}')
          i = matches[0]
          lines[i] = ('7. **Issue hygiene: ACTIVE / #272, #385, #333, #335, #349, #350, #352, #354, #356, #358, #360, #367, #374, #437 RESOLVED; #381 EVIDENCE-WAITING; #422 EXTERNALLY BLOCKED.** '
                      'Oracle V2 #272 is closed completed as a read-only provider evaluation: PR #274 (`e2e05e35b8f342d29543c6fb63022a7173dd742f`) verified the live X1 program/state contract and later freshness governance through #298 established the explicit `60000 / 5000 / 3-of-5` policy. The live Oracle V2 slots remained stale, so `current_price_use_authorized=false`, source independence and price correctness remain unverified, and no provider/public-service/Scout promotion follows. The original Instant X1 Scan freshness umbrella #385, early X1.Ninja transport/identity umbrellas #333/#335, X1.Ninja execution-price and catalog-semantic research chain #349/#350/#352/#354/#356/#358/#360/#367/#374, and Warp retention #437 are reconciled against accepted later contracts and closed. Continue auditing older open tickets before treating open-issue count as remaining roadmap work; preserve historical evidence boundaries rather than silently widening authority.')
          path.write_text('\n'.join(lines) + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/CMIS_PRODUCT_ROADMAP.md
          git commit -m 'docs: reconcile completed Oracle V2 evaluation 272'
          git push origin HEAD:docs/reconcile-oracle-v2-272
      - name: Remove one-shot workflow
        run: |
          git rm .github/workflows/reconcile-oracle-v2-272.yml
          git commit -m 'chore: remove one-shot Oracle V2 roadmap workflow'
          git push origin HEAD:docs/reconcile-oracle-v2-272
