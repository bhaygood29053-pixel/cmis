name: Tokenized Equity Intelligence Contract

on:
  pull_request:
    paths:
      - "liquidity_scout/cmis/__init__.py"
      - "liquidity_scout/cmis/capabilities.py"
      - "liquidity_scout/services/cmis_tokenized_equity_intelligence.py"
      - "liquidity_scout/services/cmis_tokenized_equity_intelligence_request.py"
      - "liquidity_scout/services/cmis_tokenized_equity_evidence_quality.py"
      - "liquidity_scout/services/cmis_tokenized_equity_provenance.py"
      - "liquidity_scout/services/cmis_cross_chain_equity_provenance.py"
      - "liquidity_scout/services/cmis_tokenized_equity_rights.py"
      - "liquidity_scout/services/cmis_tokenized_equity_market_activity.py"
      - "tests/test_cmis_tokenized_equity_intelligence_contract.py"
      - "tests/test_cmis_tokenized_equity_capability_v130.py"
      - ".github/workflows/tokenized-equity-intelligence-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  promotion-contract:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Tokenized Equity Intelligence CMIS 1.30 acceptance
        run: |
          python -m pytest -q \
            tests/test_cmis_tokenized_equity_intelligence_contract.py \
            tests/test_cmis_tokenized_equity_capability_v130.py \
            tests/test_cmis_tokenized_equity_evidence_quality.py \
            tests/test_cmis_tokenized_equity_provenance.py \
            tests/test_cmis_cross_chain_equity_provenance.py \
            tests/test_cmis_tokenized_equity_rights.py \
            tests/test_cmis_tokenized_equity_market_activity.py \
            tests/test_cmis_x1_intelligence_brief_capability_v129.py \
            tests/test_cmis_wallet_relationship_capability_v128.py
      - name: Confirm CMIS 1.30 promotion flags
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          def assignment(path, name):
              tree = ast.parse(Path(path).read_text(encoding="utf-8"))
              for node in tree.body:
                  if not isinstance(node, ast.Assign):
                      continue
                  if any(isinstance(target, ast.Name) and target.id == name for target in node.targets):
                      return ast.literal_eval(node.value)
              raise AssertionError(f"{path}: assignment {name} not found")

          version = assignment("liquidity_scout/cmis/capabilities.py", "CMIS_CONTRACT_VERSION")
          services = assignment("liquidity_scout/cmis/capabilities.py", "PUBLIC_RUNTIME_SERVICES")
          promoted = assignment("liquidity_scout/services/cmis_tokenized_equity_intelligence.py", "PROMOTED")
          assert version == "1.30.0"
          assert services[-3:] == (
              "x1_intelligence_brief_inputs",
              "tokenized_equity_intelligence",
              "wallet_relationship_intelligence",
          )
          assert promoted is True
          print("CMIS_130_PROMOTION_SOURCE_BOUNDARY=PASS")
          PY
      - name: Diff hygiene
        run: git diff --check
