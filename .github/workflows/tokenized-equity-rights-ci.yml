name: Tokenized Equity Rights v1

on:
  pull_request:
    paths:
      - "liquidity_scout/services/cmis_tokenized_equity_rights.py"
      - "liquidity_scout/services/cmis_tokenized_equity_provenance.py"
      - "tests/test_cmis_tokenized_equity_rights.py"
      - "tests/test_cmis_tokenized_equity_provenance.py"
      - "docs/TOKENIZED_EQUITY_RIGHTS_V1.md"
      - ".github/workflows/tokenized-equity-rights-ci.yml"
  push:
    branches:
      - main
    paths:
      - "liquidity_scout/services/cmis_tokenized_equity_rights.py"
      - "liquidity_scout/services/cmis_tokenized_equity_provenance.py"
      - "tests/test_cmis_tokenized_equity_rights.py"
      - "tests/test_cmis_tokenized_equity_provenance.py"
      - "docs/TOKENIZED_EQUITY_RIGHTS_V1.md"
      - ".github/workflows/tokenized-equity-rights-ci.yml"

permissions:
  contents: read

jobs:
  package:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: python -m pip install -q -r requirements.txt pytest beautifulsoup4

      - name: Tokenized-equity rights acceptance
        run: |
          python -m pytest -q \
            tests/test_cmis_tokenized_equity_rights.py \
            tests/test_cmis_tokenized_equity_provenance.py \
            tests/test_cmis_cross_chain_equity_provenance.py

      - name: Diff hygiene
        run: git diff --check
