name: Solana Token-2022 Live Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-token2022-boundary:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public shell
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install public dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate accepted Token-2022 fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from liquidity_scout.providers.solana.live_fixture import SOLANA_TOKEN_2022_LIVE_FIXTURE
          fixture = SOLANA_TOKEN_2022_LIVE_FIXTURE
          assert fixture.mint == "2b1kV6DkPAnxd5ixfnxCpjxmKwqjjaYmCZfHsFu24GXo"
          assert fixture.program_kind == "token_2022"
          assert fixture.decimals == 6
          assert fixture.execution_authorized is False
          print("SOLANA_TOKEN_2022_PUBLIC_FIXTURE=PASS")
          print("EXECUTION_AUTHORIZED=FALSE")
          PY

      - name: Explain private runtime boundary
        run: |
          echo "Full Token-2022 CMIS runtime acceptance runs only where cmis-private-core and deployment RPC credentials are securely configured."
          echo "The public repository no longer reconstructs private CMIS implementation from historical public commits."
