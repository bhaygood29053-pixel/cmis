name: Solana Token-2022 Live Verification

on:
  workflow_dispatch:
    inputs:
      run_rpc_contract:
        description: Run the repository-approved read-only Token-2022 RPC contract probe
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - "liquidity_scout/providers/solana/**"
      - "liquidity_scout/cmis/solana_*.py"
      - "tests/test_solana_rpc_live_contract.py"
      - "tests/test_solana_live_fixture.py"
      - ".github/workflows/solana-token2022-live-verify.yml"
      - "docs/SOLANA_TOKEN_2022_LIVE_FIXTURE.md"

permissions:
  contents: read

jobs:
  solana-token2022-live-verify:
    name: Read-only PYUSD Token-2022 RPC verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Optional repository secret for a production RPC provider. When absent,
      # the required core gate uses Solana's public mainnet RPC. Never print this value.
      SOLANA_RPC_URL_SECRET: ${{ secrets.SOLANA_RPC_URL }}
      # Repository-approved live readiness fixture from official Solana documentation.
      SOLANA_LIVE_TEST_MINT: 2b1kV6DkPAnxd5ixfnxCpjxmKwqjjaYmCZfHsFu24GXo
      SOLANA_LIVE_REQUIRE_TOKEN_2022: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out protected CMIS baseline
        uses: actions/checkout@v4
        with:
          repository: bhaygood29053-pixel/cmis
          ref: 45551d112e0779343c0d0e50d0d2631efc88f76c
          path: cmis-protected-baseline

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          pip install -r requirements.txt

      - name: Build private CMIS runtime
        shell: bash
        run: |
          set -euo pipefail
          rm -rf phase5-build phase5-dist phase5-runtime
          mkdir -p phase5-build/liquidity_scout/cmis phase5-build/cmis_core phase5-dist phase5-runtime/site

          cp cmis-protected-baseline/liquidity_scout/cmis/*.py phase5-build/liquidity_scout/cmis/
          rm -f \
            phase5-build/liquidity_scout/cmis/__init__.py \
            phase5-build/liquidity_scout/cmis/capabilities.py \
            phase5-build/liquidity_scout/cmis/http.py

          cat > phase5-build/pyproject.toml <<'EOF'
          [build-system]
          requires = ["setuptools>=68", "wheel"]
          build-backend = "setuptools.build_meta"

          [project]
          name = "cmis-private-core"
          version = "0.2.0"
          requires-python = ">=3.11"
          dependencies = []

          [tool.setuptools.packages.find]
          where = ["."]
          include = ["cmis_core*", "liquidity_scout.cmis*"]
          namespaces = true
          EOF

          cat > phase5-build/cmis_core/__init__.py <<'EOF'
          __version__ = "0.2.0"
          PHASE = 3
          PUBLIC_SHELL_REPOSITORY = "bhaygood29053-pixel/cmis"
          PUBLIC_SHELL_BASELINE = "bd9aaa786a9188d3edbfa35692b6754fd9b8b769"
          EOF

          cat > phase5-build/cmis_core/api.py <<'EOF'
          from __future__ import annotations

          CUTOVER_CONTRACT = "cmis-private-core/v1"

          def runtime_gateway_class():
              from liquidity_scout.cmis.runtime_gateway import RuntimeCMISGateway
              return RuntimeCMISGateway

          def runtime_contract():
              from liquidity_scout.cmis.gateway import KNOWN_CHAINS, SUPPORTED_CHAINS
              from liquidity_scout.cmis.runtime_gateway import SUPPORTED_SERVICES, RuntimeCMISGateway
              return {
                  "contract": CUTOVER_CONTRACT,
                  "gateway_class": RuntimeCMISGateway,
                  "supported_services": tuple(SUPPORTED_SERVICES),
                  "supported_chains": tuple(SUPPORTED_CHAINS),
                  "known_chains": tuple(KNOWN_CHAINS),
              }
          EOF

          python -m build --wheel --outdir phase5-dist phase5-build
          python -m pip install --no-deps --target phase5-runtime/site phase5-dist/*.whl
          rsync -a --ignore-existing liquidity_scout/ phase5-runtime/site/liquidity_scout/
          python -m compileall -q phase5-runtime/site

      - name: Validate accepted fixture contract
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from liquidity_scout.providers.solana.live_fixture import SOLANA_TOKEN_2022_LIVE_FIXTURE

          fixture = SOLANA_TOKEN_2022_LIVE_FIXTURE
          assert fixture.mint == "2b1kV6DkPAnxd5ixfnxCpjxmKwqjjaYmCZfHsFu24GXo"
          assert fixture.program_kind == "token_2022"
          assert fixture.decimals == 6
          assert fixture.execution_authorized is False
          print("Repository-approved read-only Token-2022 fixture validated.")
          PY

      - name: Run accepted Token-2022 core runtime probe
        if: ${{ github.event_name == 'pull_request' || inputs.run_rpc_contract }}
        shell: bash
        env:
          RUN_SOLANA_LIVE_TESTS: "1"
        run: |
          set -euo pipefail
          export SOLANA_RPC_URL="${SOLANA_RPC_URL_SECRET:-https://api.mainnet-beta.solana.com}"
          cd phase5-runtime
          PYTHONPATH="$GITHUB_WORKSPACE/phase5-runtime/site:$GITHUB_WORKSPACE" \
            python -m unittest tests.test_solana_rpc_live_contract -v

      - name: Largest-account live acceptance status
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${SOLANA_RPC_URL_SECRET:-}" ]; then
            echo "Dedicated Solana RPC is configured; largest-account live acceptance is eligible."
          else
            echo "Dedicated Solana RPC is unavailable to this runner; getTokenLargestAccounts live acceptance remains a deployment blocker for CMIS issue #244."
          fi

      - name: Safety and scope boundary
        run: |
          echo "Fixture: PYUSD exact Solana mint, Token-2022, read-only readiness scope only."
          echo "Required core live methods: getTokenSupply and getAccountInfo(jsonParsed)."
          echo "Production runtime asset_lookup and tokenomics are exercised against the exact fixture."
          echo "getTokenLargestAccounts requires a dedicated RPC for issue #244 final live acceptance."
          echo "Largest token accounts remain account-only concentration evidence, not holder or owner identity."
          echo "No wallet key, transaction preparation, execution-precursor simulation, signing, broadcasting, swap route, or value movement is used."
