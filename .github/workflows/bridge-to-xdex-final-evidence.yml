name: Bridge-to-XDEX Final #410 Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  issue410-unit:
    name: Test #410 24h activity and value basis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Run #410 deterministic tests
        run: |
          python -m pytest -q tests/test_cmis_issue410_activity_value_basis.py tests/test_cmis_bridge_to_xdex_utilization.py tests/test_x1_xdex_representation_pool_universe.py tests/test_x1_verified_program_pool_set.py

  issue410-live-24h:
    name: Prove live wSOL.X 24h XDEX program activity window
    needs: issue410-unit
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/issue410-24h-value-basis')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove exact 24h XDEX-program wSOL.X activity window
        run: |
          python - <<'PY'
          import json
          import os
          import time

          from liquidity_scout.providers.x1.market import fetch_all_pools
          from liquidity_scout.providers.x1.verified_program_pool_set import (
              verify_recognized_program_asset_pool_set,
          )
          from liquidity_scout.providers.x1.warp_bridged_supply_evidence import (
              WSOL_X_DESTINATION_MINT,
          )
          from liquidity_scout.services.cmis_xdex_program_window_activity import (
              prove_xdex_program_asset_window_activity,
          )

          rpc_url = os.environ["X1_RPC_URL"]
          catalog, _ = fetch_all_pools(sleep_seconds=0)
          pool_set = verify_recognized_program_asset_pool_set(
              asset_mint=WSOL_X_DESTINATION_MINT,
              catalog_pools=catalog,
              rpc_url=rpc_url,
              layout_sample_pools=8,
              min_layout_pools=3,
              allow_verified_zero_set=True,
          )
          summary = pool_set["summary"]
          assert summary[
              "recognized_program_asset_pool_set_structurally_verified"
          ] is True
          assert summary["targeted_program_family_mint_filter_observed"] is True

          end_epoch = time.time()
          start_epoch = end_epoch - 86400.0
          result = prove_xdex_program_asset_window_activity(
              program_id=pool_set["program_id"],
              asset_mint=WSOL_X_DESTINATION_MINT,
              start_epoch=start_epoch,
              end_epoch=end_epoch,
              rpc_url=rpc_url,
              page_size=1000,
              max_signatures=20000,
          )

          public = {
              "contract": result["contract"],
              "program_id": result["program_id"],
              "asset_mint": result["asset_mint"],
              "requested_window": result["requested_window"],
              "program_signature_range_proven": result[
                  "program_signature_range_proven"
              ],
              "program_signature_integrity_verified": result[
                  "program_signature_integrity_verified"
              ],
              "window_signature_count": result["window_signature_count"],
              "successful_window_signature_count": result[
                  "successful_window_signature_count"
              ],
              "failed_window_signature_count": result[
                  "failed_window_signature_count"
              ],
              "transaction_fetch_unavailable_count": result[
                  "transaction_fetch_unavailable_count"
              ],
              "transaction_identity_conflict_count": result[
                  "transaction_identity_conflict_count"
              ],
              "transaction_verification_error_count": result[
                  "transaction_verification_error_count"
              ],
              "target_mint_activity_transaction_count": result[
                  "target_mint_activity_transaction_count"
              ],
              "target_mint_delta_count": result["target_mint_delta_count"],
              "window_trace_complete_verified": result[
                  "window_trace_complete_verified"
              ],
              "program_scoped_asset_activity_zero_verified": result[
                  "program_scoped_asset_activity_zero_verified"
              ],
              "volume_24h_window_coverage_verified": result[
                  "volume_24h_window_coverage_verified"
              ],
              "volume_24h_semantics_verified": result[
                  "volume_24h_semantics_verified"
              ],
              "verified_volume_24h_value": result[
                  "verified_volume_24h_value"
              ],
              "verified_volume_24h_unit": result[
                  "verified_volume_24h_unit"
              ],
              "zero_authorization_basis": result["zero_authorization_basis"],
              "recognized_program_registry_globally_exhaustive": result[
                  "recognized_program_registry_globally_exhaustive"
              ],
              "global_onchain_pool_discovery_proven": result[
                  "global_onchain_pool_discovery_proven"
              ],
              "execution_authorized": result["execution_authorized"],
          }
          print("BRIDGE_TO_XDEX_WSOLX_24H_PROGRAM_ACTIVITY_EVIDENCE")
          print(json.dumps(public, indent=2, sort_keys=True))

          assert result["program_signature_range_proven"] is True
          assert result["program_signature_integrity_verified"] is True
          assert result["window_trace_complete_verified"] is True
          assert result["transaction_fetch_unavailable_count"] == 0
          assert result["transaction_identity_conflict_count"] == 0
          assert result["transaction_verification_error_count"] == 0
          assert result["program_scoped_asset_activity_zero_verified"] is True
          assert result["volume_24h_window_coverage_verified"] is True
          assert result["volume_24h_semantics_verified"] is True
          assert result["verified_volume_24h_value"] == "0"
          assert result["verified_volume_24h_unit"] == "USD"
          assert result["recognized_program_registry_globally_exhaustive"] is False
          assert result["global_onchain_pool_discovery_proven"] is False
          assert result["execution_authorized"] is False
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1 getSignaturesForAddress/getTransaction evidence only."
          echo "No swap, transaction preparation, signing, broadcast, custody, or value movement."
          echo "Zero volume is authorized only by a complete verified program trace with no target-mint delta."
          echo "EXECUTION_AUTHORIZED=FALSE"

  issue410-live-value:
    name: Prove live comparable wSOL.X USD value basis
    needs: issue410-unit
    if: github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'feature/issue410-24h-value-basis')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prove fresh Pyth SOL/USD plus exact Warp wSOL backing
        run: |
          python - <<'PY'
          import json
          import time

          from liquidity_scout.providers.solana.pyth_push import (
              PythSolanaPushProvider,
              WSOL_MINT,
          )
          from liquidity_scout.providers.solana.rpc import SolanaRPCProvider
          from liquidity_scout.providers.x1.warp_bridged_supply_evidence import (
              WSOL_ROUTE_ID,
              WSOL_SOURCE_MINT,
              WSOL_X_DESTINATION_MINT,
              build_warp_bridged_supply_evidence,
              capture_destination_mint_observation,
              capture_source_vault_observation,
          )
          from liquidity_scout.providers.x1.warp_config_semantics import (
              build_warp_config_route_observation,
          )
          from liquidity_scout.providers.x1.warp_message_retention_coverage import (
              fetch_official_warp_config,
          )
          from liquidity_scout.providers.x1.wsolx_value_basis import (
              build_wsolx_value_basis,
          )

          def endpoint(chain, mint):
              return {
                  "chain": chain,
                  "asset_id": mint,
                  "asset_id_kind": "mint",
              }

          assert WSOL_MINT == WSOL_SOURCE_MINT

          route = build_warp_config_route_observation(
              config_response=fetch_official_warp_config(),
              route_id=WSOL_ROUTE_ID,
              source=endpoint("solana", WSOL_SOURCE_MINT),
              destination=endpoint("x1", WSOL_X_DESTINATION_MINT),
          )
          backing = build_warp_bridged_supply_evidence(
              route_observation=route,
              source_vault=capture_source_vault_observation(
                  source_mint=WSOL_SOURCE_MINT,
              ),
              destination_mint=capture_destination_mint_observation(
                  destination_mint=WSOL_X_DESTINATION_MINT,
              ),
              evaluated_at=time.time(),
          )

          rpc = SolanaRPCProvider(
              rpc_url="https://api.mainnet-beta.solana.com",
              commitment="confirmed",
          )
          pyth = PythSolanaPushProvider(rpc).get_price(WSOL_MINT)
          basis = build_wsolx_value_basis(
              bridged_supply=backing,
              pyth_sol_usd=pyth,
          )

          public = {
              "contract": basis["contract"],
              "evidence_id": basis["evidence_id"],
              "route_id": basis["route_id"],
              "asset_mint": basis["asset_mint"],
              "source_asset_mint": basis["source_asset_mint"],
              "unit": basis["unit"],
              "price_per_token": basis["price_per_token"],
              "observed_at": basis["observed_at"],
              "source_price_feed": basis["source_price_feed"],
              "source_native_wsol_sol_value_equivalence_verified": basis[
                  "source_native_wsol_sol_value_equivalence_verified"
              ],
              "warp_source_destination_unit_equivalence_verified": basis[
                  "warp_source_destination_unit_equivalence_verified"
              ],
              "warp_current_backing_closure_verified": basis[
                  "warp_current_backing_closure_verified"
              ],
              "price_semantics_verified": basis["price_semantics_verified"],
              "price_freshness_verified": basis["price_freshness_verified"],
              "comparable_value_basis_verified": basis[
                  "comparable_value_basis_verified"
              ],
              "source_independence_verified": basis[
                  "source_independence_verified"
              ],
              "global_current_price_promoted": basis[
                  "global_current_price_promoted"
              ],
              "execution_authorized": basis["execution_authorized"],
          }
          print("BRIDGE_TO_XDEX_WSOLX_VALUE_BASIS_EVIDENCE")
          print(json.dumps(public, indent=2, sort_keys=True))

          assert backing["current_backing_closure_verified"] is True
          assert backing["bridged_supply_verified"] is True
          assert basis["source_native_wsol_sol_value_equivalence_verified"] is True
          assert basis["warp_source_destination_unit_equivalence_verified"] is True
          assert basis["warp_current_backing_closure_verified"] is True
          assert basis["price_semantics_verified"] is True
          assert basis["price_freshness_verified"] is True
          assert basis["comparable_value_basis_verified"] is True
          assert basis["source_independence_verified"] is False
          assert basis["global_current_price_promoted"] is False
          assert basis["execution_authorized"] is False
          PY

      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only Solana Pyth account + Warp vault/mint RPC evidence only."
          echo "No Hermes call, no price-update submission, no transaction construction, signing, broadcast, custody, or value movement."
          echo "Source independence and global current-price promotion remain false."
          echo "EXECUTION_AUTHORIZED=FALSE"
