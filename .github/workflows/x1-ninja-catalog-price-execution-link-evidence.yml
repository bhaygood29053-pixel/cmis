name: X1.Ninja Catalog Price Execution-Link Evidence

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-price-link:
    name: Catalog priceNative vs in-window XDEX swaps
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/issue352-catalog-price-execution-link'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      X1_NINJA_API_KEY: ${{ secrets.X1_NINJA_API_KEY }}
      X1_RPC_URL: https://rpc.mainnet.x1.xyz
      RUN_X1_NINJA_CATALOG_PRICE_LINK_LIVE: "1"
      X1_NINJA_CATALOG_LINK_MAX_SNAPSHOTS: "36"
      X1_NINJA_CATALOG_LINK_POLL_SECONDS: "10"
      X1_NINJA_CATALOG_LINK_LIMIT: "100"
      X1_NINJA_CATALOG_LINK_MAX_POOLS: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify X1.Ninja key
        run: |
          test -n "${X1_NINJA_API_KEY:-}"
      - name: Run deterministic catalog-link tests
        run: |
          python -m unittest tests.test_x1_ninja_catalog_price_execution_link -v
      - name: Run bounded live catalog-link evidence
        run: |
          python -m unittest tests.test_x1_ninja_catalog_price_execution_link_live -v
      - name: Safety boundary
        if: always()
        run: |
          echo "Read-only X1.Ninja/X1 RPC price-link evidence only."
          echo "No provider fact-time, freshness, priceUsd, liquidity, TVL, source-independence, transaction construction, signing, broadcasting, custody, trading, or execution promotion."
