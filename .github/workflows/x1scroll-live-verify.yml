name: X1Scroll RPC Access Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x1scroll-rpc-access:
    name: Read-only X1Scroll RPC access probe
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe exact published X1Scroll RPC candidates
        env:
          RUN_X1SCROLL_RPC_LIVE_TESTS: "1"
        run: |
          python -m unittest tests.test_x1scroll_rpc_access_live -v

      - name: Safety boundary
        run: |
          echo "Read-only JSON-RPC access classification only."
          echo "Only the exact published X1Scroll candidate URLs are probed."
          echo "Only getHealth and getSlot are sent; no transaction/write methods are allowed."
          echo "No credentials or API keys are supplied."
          echo "A successful response does not prove source independence, retention, finality semantics, archival completeness, failover quality, or CMIS promotion."
          echo "No signing, transaction preparation, broadcasting, custody, trading, bridge transfer, execution, or value movement is performed."
