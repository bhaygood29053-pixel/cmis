name: wallet-relationship-request

on:
  push:
    paths:
      - "liquidity_scout/services/cmis_wallet_relationship_request.py"
      - "tests/test_cmis_wallet_relationship_request.py"
      - "docs/WALLET_RELATIONSHIP_REQUEST_V1.md"
      - ".github/workflows/wallet-relationship-request.yml"
  pull_request:
    paths:
      - "liquidity_scout/services/cmis_wallet_relationship_request.py"
      - "tests/test_cmis_wallet_relationship_request.py"
      - "docs/WALLET_RELATIONSHIP_REQUEST_V1.md"
      - ".github/workflows/wallet-relationship-request.yml"

permissions:
  contents: read

jobs:
  request-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependency
        run: python -m pip install pytest

      - name: Test wallet relationship selector-only request v1
        env:
          PYTHONPATH: .
        run: python -m pytest -q tests/test_cmis_wallet_relationship_request.py

      - name: Verify no runtime or capability promotion
        run: |
          python - <<'PY'
          from pathlib import Path

          capabilities = Path("liquidity_scout/cmis/capabilities.py").read_text(encoding="utf-8")
          runtime = Path("liquidity_scout/cmis/__init__.py").read_text(encoding="utf-8")

          assert '"wallet_relationship_intelligence"' not in capabilities.split("PUBLIC_RUNTIME_SERVICES", 1)[1].split(")", 1)[0]
          assert '"wallet_relationship_intelligence"' not in runtime.split("SUPPORTED_SERVICES", 1)[1].split(")", 1)[0]
          print("WALLET_RELATIONSHIP_REQUEST_NON_PROMOTION=PASS")
          PY
